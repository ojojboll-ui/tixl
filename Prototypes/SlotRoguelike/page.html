<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#120e1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one portrait cabinet column. HUD on top, battle stage, the three reels, a big lever button at thumb height. */
:root {
  --ink: #120e1c;
  --stone: #1e172e;
  --stone-2: #2b2242;
  --line: #43365f;
  --brass: #f0b648;
  --brass-dk: #9d6a1c;
  --parch: #f3e6c9;
  --muted: #a99cc6;
  --blood: #e8505f;
  --mana: #63b8ff;
  --leaf: #8adf6e;
  --display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --mono: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--parch);
  font-family: var(--display);
  font-size: 16px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

#app {
  position: relative;
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  box-sizing: border-box;
  overflow: hidden;
}

/* ---------- HUD ---------- */
.hud { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.hud[hidden] { display: none !important; }
.gold {
  display: flex; align-items: center; gap: 6px;
  background: var(--stone-2); border: 2px solid var(--brass-dk);
  padding: 2px 10px 2px 6px; border-radius: 4px;
  font-family: var(--mono); font-size: 22px; color: var(--brass);
  font-variant-numeric: tabular-nums;
}
.gold img { width: 28px; height: 28px; }
.gold.low { color: var(--blood); border-color: var(--blood); animation: throb 0.8s steps(2) infinite; }
.gold small { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; }
.floor { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; flex: 1; text-align: center; line-height: 1.2; }
.iconbtn {
  width: 40px; height: 40px; display: grid; place-items: center;
  background: var(--stone-2); border: 2px solid var(--line); border-radius: 4px; padding: 0;
  font-family: var(--mono); font-size: 16px;
}
.iconbtn img { width: 26px; height: 26px; }
.iconbtn:active { transform: translateY(2px); }
@keyframes throb { 50% { opacity: 0.55; } }

#screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scr { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
h2 { font-size: 24px; color: var(--brass); }
p { margin: 0; line-height: 1.4; }
.lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--brass); color: var(--ink);
  border: 0; border-radius: 4px;
  padding: 14px 18px; font-weight: 700; font-size: 18px;
  box-shadow: 0 5px 0 var(--brass-dk), inset 0 -3px 0 rgba(0,0,0,0.12);
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--brass-dk); }
.btn.ghost { background: var(--stone-2); color: var(--parch); box-shadow: 0 5px 0 #0b0812; border: 2px solid var(--line); }
.btn:disabled { opacity: 0.45; transform: none; }
.btn img { width: 24px; height: 24px; }

/* ---------- Title ---------- */
.title { justify-content: center; align-items: stretch; text-align: center; gap: 20px; }
.logo { font-size: clamp(40px, 13vw, 58px); line-height: 0.92; color: var(--brass); letter-spacing: 0.01em;
  text-shadow: 0 4px 0 var(--brass-dk), 0 8px 0 #000; }
.logo span { display: block; color: var(--parch); text-shadow: 0 4px 0 #6b5a3a, 0 8px 0 #000; }
.tagline { color: var(--muted); max-width: 30ch; margin: 0 auto; }
.trio { display: flex; justify-content: center; gap: 10px; }
.trio img { width: 72px; height: 72px; animation: bob 1.2s steps(2) infinite; }
.trio img:nth-child(2) { animation-delay: 0.4s; }
.trio img:nth-child(3) { animation-delay: 0.8s; }
.title .stack { display: grid; gap: 14px; }
@keyframes bob { 50% { transform: translateY(-4px); } }

/* ---------- Class select ---------- */
.cls-list { display: grid; gap: 10px; overflow-y: auto; min-height: 0; padding-bottom: 8px; }
.cls {
  display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--stone); border: 2px solid var(--line); border-radius: 6px; padding: 10px;
}
.cls:active, .cls:hover { border-color: var(--brass); }
.cls > img.px { width: 72px; height: 72px; }
.cls h3 { font-size: 20px; }
.cls p { font-size: 14px; color: var(--muted); margin-top: 2px; }
.cls .passive { color: var(--parch); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: var(--stone-2); border-radius: 3px; padding: 1px 5px 1px 2px; font-family: var(--mono); font-size: 11px; }
.chip img { width: 18px; height: 18px; }

/* ---------- Map ---------- */
.map-scroll { flex: 1; min-height: 0; overflow-y: auto; border: 2px solid var(--line); border-radius: 6px;
  background:
    radial-gradient(circle at 20% 30%, rgba(240,182,72,0.06), transparent 40%),
    repeating-linear-gradient(0deg, transparent 0 22px, rgba(255,255,255,0.025) 22px 24px),
    var(--stone); }
.map-inner { position: relative; margin: 0 8px; }
.map-inner svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.node {
  position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; padding: 0;
  display: grid; place-items: center;
  background: var(--stone-2); border: 2px solid var(--line); border-radius: 50%;
}
.node img { width: 32px; height: 32px; }
.node.boss { width: 72px; height: 72px; margin: -36px 0 0 -36px; border-color: var(--blood); }
.node.boss img { width: 52px; height: 52px; }
.node.locked { opacity: 0.5; filter: grayscale(0.7); }
.node.done { opacity: 0.35; filter: grayscale(1); }
.node.here { border-color: var(--parch); opacity: 1; filter: none; }
.node.reach { border-color: var(--brass); box-shadow: 0 0 0 4px rgba(240,182,72,0.18); animation: pulse 0.9s steps(2) infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(240,182,72,0.32); } }
.map-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.legend span { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); }
.legend img { width: 18px; height: 18px; }

/* ---------- Fight ---------- */
.fight { gap: 10px; }
.stage {
  position: relative; height: clamp(170px, 30vh, 240px); flex: none;
  border: 2px solid var(--line); border-radius: 6px; overflow: hidden;
  background:
    linear-gradient(to bottom, transparent 64%, #17121f 64%, #17121f 66%, #251d35 66%),
    repeating-linear-gradient(90deg, #1b1529 0 30px, #1f182e 30px 32px),
    #1b1529;
}
.stage::after { /* torch glow */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 18%, rgba(240,140,60,0.14), transparent 55%);
}
.ehead { position: absolute; top: 8px; right: 8px; left: 46%; z-index: 2; display: grid; gap: 3px; }
.ename { font-size: 14px; text-align: right; font-weight: 600; }
.hpbar { position: relative; height: 14px; background: #0b0812; border: 2px solid #000; border-radius: 2px; }
.hpbar i { position: absolute; inset: 0 auto 0 0; background: var(--blood); transition: width 0.25s steps(5); }
.hpbar b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 9px; font-weight: 400; color: #fff; text-shadow: 1px 1px 0 #000; }
.intent { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-family: var(--mono); font-size: 13px; }
.intent img { width: 20px; height: 20px; }
.pips { display: inline-flex; gap: 3px; margin-left: 4px; }
.pips i { width: 7px; height: 7px; background: var(--brass); }
.pips i.off { background: var(--line); }
.intent.now { color: var(--blood); animation: throb 0.5s steps(2) infinite; }
.actor { position: absolute; bottom: 26%; z-index: 1; }
.actor img { width: clamp(72px, 22vw, 96px); height: auto; }
.hero { left: 9%; }
.enemy { right: 9%; }
.enemy.big img { width: clamp(100px, 32vw, 132px); }
.actor .sprite { animation: bob 1s steps(2) infinite; }
.enemy .sprite { animation-delay: 0.5s; }
.blockbadge { position: absolute; left: -6px; top: -14px; display: flex; align-items: center; gap: 1px;
  font-family: var(--mono); font-size: 13px; color: var(--mana); background: rgba(10,8,18,0.8); padding: 0 4px 0 1px; border-radius: 3px; }
.blockbadge img { width: 20px; height: 20px; }
.blockbadge[hidden] { display: none !important; }
.lunge-r { animation: lungeR 0.28s steps(3); }
.lunge-l { animation: lungeL 0.28s steps(3); }
.hit { animation: hit 0.32s steps(4); }
@keyframes lungeR { 50% { transform: translateX(34px); } }
@keyframes lungeL { 50% { transform: translateX(-34px); } }
@keyframes hit { 0%, 100% { transform: translateX(0); filter: none; } 25% { transform: translateX(6px); filter: brightness(4) saturate(0); } 50% { transform: translateX(-6px); } 75% { transform: translateX(4px); filter: brightness(4) saturate(0); } }
.dead { animation: die 0.7s steps(6) forwards; }
@keyframes die { to { transform: translateY(20px) scaleY(0.2); opacity: 0; filter: brightness(3); } }
.banner { position: absolute; left: 0; right: 0; top: 44%; z-index: 3; text-align: center; pointer-events: none;
  font-size: 26px; font-weight: 700; color: var(--brass); text-shadow: 0 3px 0 #000, 0 0 12px rgba(240,182,72,0.5); opacity: 0; }
.banner.show { animation: banner 0.9s steps(8) forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(0.6); } 20% { opacity: 1; transform: scale(1.1); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

.machine {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: linear-gradient(#3a2a12, #2a1e0c); border: 3px solid var(--brass); border-radius: 8px;
  box-shadow: inset 0 0 0 3px #000, 0 4px 0 var(--brass-dk);
  padding: 8px;
}
.reels { position: relative; flex: 1; min-height: 0; max-height: 330px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.reel { position: relative; overflow: hidden; background: #f3e6c9; border-radius: 3px; box-shadow: inset 0 0 0 2px #000; }
.reel::after { /* curved drum shading */
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 22%, transparent 78%, rgba(0,0,0,0.5));
}
.strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.cell { position: relative; display: grid; place-items: center; }
.cell img { height: 72%; width: auto; max-width: 86%; aspect-ratio: 1; }
.cell .lv { position: absolute; right: 4px; top: 3px; font-family: var(--mono); font-style: normal; font-size: 11px; color: #fff; background: var(--brass-dk); padding: 0 3px; border-radius: 2px; z-index: 1; }
.cell .tmp { position: absolute; left: 4px; top: 3px; font-family: var(--mono); font-style: normal; font-size: 9px; color: #fff; background: var(--blood); padding: 0 3px; border-radius: 2px; z-index: 1; }
.cell.win { background: rgba(240,182,72,0.55); }
.cell.pop img { animation: pop 0.35s steps(3); }
@keyframes pop { 50% { transform: scale(1.22); } }
.paylines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
.log { font-size: 14px; color: var(--muted); min-height: 2.8em; line-height: 1.4; text-align: center; }
.log b { color: var(--parch); font-weight: 600; }
.spin { font-size: 22px; padding-block: 16px; letter-spacing: 0.04em; }
.spin small { font-family: var(--mono); font-size: 14px; display: inline-flex; align-items: center; gap: 2px; }

.float { position: absolute; z-index: 20; pointer-events: none; font-family: var(--mono); font-size: 20px; font-weight: 400;
  text-shadow: 2px 2px 0 #000; transform: translate(-50%, -50%); animation: floatUp 1s steps(10) forwards; white-space: nowrap; }
.float.dmg { color: #fff; font-size: 26px; }
.float.gold { color: var(--brass); }
.float.loss { color: var(--blood); }
.float.block { color: var(--mana); }
@keyframes floatUp { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -48px; } }

/* ---------- Rooms ---------- */
.room { overflow-y: auto; padding-bottom: 8px; }
.room .head { display: flex; align-items: center; gap: 12px; }
.room .head img { width: 56px; height: 56px; flex: none; }
.room .head p { color: var(--muted); font-size: 15px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  background: var(--stone); border: 2px solid var(--line); border-radius: 6px; padding: 10px 6px; min-width: 0;
}
.tile img.px { width: 52px; height: 52px; }
.tile b { font-size: 15px; }
.tile span { font-size: 12px; color: var(--muted); line-height: 1.25; }
.tile .price { font-family: var(--mono); font-size: 13px; color: var(--brass); display: inline-flex; align-items: center; gap: 2px; }
.tile .price img { width: 16px; height: 16px; }
.tile.sel { border-color: var(--brass); background: var(--stone-2); }
.tile.gone { opacity: 0.35; }
.tile:disabled { opacity: 0.4; }
.chest-row .tile img.px { width: 72px; height: 72px; }
.chest-row .tile.open img.px { animation: pop 0.4s steps(3); }
.result { background: var(--stone-2); border-left: 4px solid var(--brass); padding: 10px 12px; border-radius: 3px; line-height: 1.4; }
.bagrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
.bagrid .tile { padding: 6px 2px; }
.bagrid .tile img.px { width: 40px; height: 40px; }
.choices { display: grid; gap: 12px; }
.spacer { flex: 1; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 16px; }
.stats b { font-family: var(--mono); color: var(--brass); font-weight: 400; }

/* ---------- Modal ---------- */
.modal { position: absolute; inset: 0; z-index: 50; background: rgba(8,6,14,0.88); display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
.modal[hidden] { display: none !important; }
.sheet { flex: 1; min-height: 0; overflow-y: auto; background: var(--stone); border: 2px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 14px; align-content: start; }
.sheet h3 { color: var(--brass); font-size: 19px; }
.sheet .row { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; }
.sheet .row img { width: 36px; height: 36px; }
.sheet .row p { font-size: 14px; color: var(--muted); }
.sheet .row p b { color: var(--parch); font-weight: 600; }
.sheet .row .n { font-family: var(--mono); font-size: 13px; color: var(--brass); text-align: right; }
.sheet .txt { font-size: 15px; line-height: 1.45; color: var(--parch); }
.sheet .txt + .txt { margin-top: -6px; }
.modal .btn { margin-top: 12px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}
</style>

<div id="app">
  <div class="hud" id="hud" hidden>
    <div class="gold" id="gold"><img class="px" id="goldIcon" alt=""><span id="goldN">0</span></div>
    <div class="floor" id="floorLbl"></div>
    <button class="iconbtn" id="bagBtn" aria-label="Visa väskan"><img class="px" id="bagIcon" alt=""></button>
    <button class="iconbtn" id="helpBtn" aria-label="Regler">?</button>
  </div>
  <div id="screen"></div>
  <div class="modal" id="modal" hidden>
    <div class="sheet" id="sheet"></div>
    <button class="btn ghost" id="modalClose">Stäng</button>
  </div>
</div>

function makeSprite(rows) {
  const N = 18, cv = document.createElement('canvas');
  cv.width = cv.height = N;
  const cx = cv.getContext('2d');
  const grid = Array.from({ length: N }, () => Array(N).fill(null));
  rows.forEach((row, r) => { for (let c = 0; c < 16; c++) { const ch = row[c]; if (ch && ch !== '.') grid[r + 1][c + 1] = PAL[ch]; } });
  // 1px outline, 8-connected
  const OUT = '#0d0a14';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (grid[r][c]) continue;
    let near = false;
    for (let dr = -1; dr <= 1 && !near; dr++) for (let dc = -1; dc <= 1; dc++) {
      const v = grid[r + dr]?.[c + dc]; if (v && v !== OUT) { near = true; break; }
    }
    if (near) { cx.fillStyle = OUT; cx.fillRect(c, r, 1, 1); }
  }
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c]) { cx.fillStyle = grid[r][c]; cx.fillRect(c, r, 1, 1); }
  return cv.toDataURL();
}

function lineType(cells) {
  const nw = cells.filter(c => c.t !== 'gem');
  if (!nw.length) return 'gem';
  const t = nw[0].t;
  if (!nw.every(c => c.t === t)) return null;
  if (t === 'skull' && nw.length < 3) return null; // jokers never complete a curse
  return t;
}

function resolveSpin(run, fight, grid) {
  const out = { hits: [], block: 0, gold: 0, lines: [], storm: false, cells: [] };
  let fires = 0;
  grid.forEach((row, r) => row.forEach((s, c) => {
    switch (s.t) {
      case 'sword':  out.hits.push({ v: swordDmg(run, s.lvl), pierce: false, t: 'sword' }); break;
      case 'fire':   out.hits.push({ v: fireDmg(run, s.lvl), pierce: true, t: 'fire' }); fires++; break;
      case 'shield': out.block += shieldVal(run, s.lvl); break;
      case 'coin':   out.gold += coinVal(run, s.lvl); if (run.cls === 'rogue') out.hits.push({ v: 2, pierce: true, t: 'coin' }); break;
      case 'gem':    out.gold += 1 + (has(run, 'magnet') ? 2 : 0); if (has(run, 'magnet')) out.hits.push({ v: 2, pierce: true, t: 'gem' }); break;
      case 'skull':
        if (has(run, 'bonering')) out.hits.push({ v: 3, pierce: true, t: 'skull' });
        else out.gold -= 1;
        break;
    }
    out.cells.push([r, c]);
  }));
  if (run.cls === 'mage' && fires >= 4) {
    out.storm = true;
    out.hits.forEach(h => { if (h.t === 'fire') h.v *= 2; });
  }
  LINES.forEach((ln, i) => {
    const cells = ln.map(([r, c]) => grid[r][c]);
    const t = lineType(cells);
    if (!t) return;
    const fx = LINE_FX[t];
    const lv = cells.reduce((a, c) => a + c.lvl, 0);
    let dmg = 0, gold = fx.gold;
    if (fx.dmg) {
      dmg = fx.dmg + lv * 2;
      if (t === 'fire' && out.storm) dmg *= 2;
      out.hits.push({ v: dmg, pierce: true, t: 'line' });
      if (has(run, 'vampire')) gold += Math.floor(dmg / 2);
    }
    if (fx.block) out.block += fx.block + lv;
    if (gold > 0 && has(run, 'tooth')) gold += 3;
    out.gold += gold;
    out.lines.push({ i, t, dmg, gold });
  });
  const armor = fight.enemy.armor || 0;
  out.dmg = out.hits.reduce((a, h) => a + Math.max(0, h.v - (h.pierce ? 0 : armor)), 0);
  return out;
}

// Apply one spin to state. Returns everything the UI needs to animate it.
function applySpin(run, fight) {
  const cost = Math.min(spinCost(run), run.gold);
  run.gold -= cost;
  const grid = rollGrid(run.bag.concat(fight.temp));
  const res = resolveSpin(run, fight, grid);
  res.cost = cost; res.grid = grid;
  fight.grid = grid; fight.spins++; run.stats.spins++;
  fight.block += res.block;
  res.blockTotal = fight.block;
  const e = fight.enemy;
  e.hp = Math.max(0, e.hp - res.dmg);
  run.gold += res.gold;
  if (run.gold < 0) run.gold = 0;
  if (res.dmg > run.stats.best) run.stats.best = res.dmg;
  if (e.hp <= 0) { res.killed = true; return res; }
  if (e.enrage && !e.enraged && e.hp <= e.maxHp / 2) { e.enraged = true; res.enraged = true; }
  e.timer--;
  if (e.timer <= 0) {
    e.timer = e.every;
    const atk = enemyAtk(e);
    const absorbed = Math.min(fight.block, atk);
    const taken = atk - absorbed;
    fight.block = 0;
    run.gold = Math.max(0, run.gold - taken);
    let curse = false;
    if (e.curse) { fight.temp.push({ t: 'skull', lvl: 0, temp: true }); curse = true; }
    res.enemy = { atk, absorbed, taken, curse };
  }
  if (run.gold <= 0) res.dead = true;
  return res;
}

const FLOORS = 8, COLS = 4;
function genMap() {
  const nodes = {}, edges = [];
  const key = (f, c) => f + '-' + c;
  const starts = shuffle([0, 1, 2, 3]).slice(0, 3);
  starts.push(pick(starts));
  for (let c of starts) {
    for (let f = 0; f < FLOORS; f++) {
      const k = key(f, c);
      if (!nodes[k]) nodes[k] = { k, f, c, type: null, jx: (rng() - 0.5) * 0.35, jy: (rng() - 0.5) * 18 };
      if (f === FLOORS - 1) { if (!edges.some(e => e[0] === k && e[1] === 'boss')) edges.push([k, 'boss']); break; }
      let nc = Math.max(0, Math.min(COLS - 1, c + ri(-1, 1)));
      const crosses = edges.some(([a, b]) => {
        const A = nodes[a], B = nodes[b];
        if (!A || !B || A.f !== f) return false;
        return (c < A.c && nc > B.c) || (c > A.c && nc < B.c);
      });
      if (crosses) nc = c;
      const nk = key(f + 1, nc);
      if (!nodes[nk]) nodes[nk] = { k: nk, f: f + 1, c: nc, type: null, jx: (rng() - 0.5) * 0.35, jy: (rng() - 0.5) * 18 };
      if (!edges.some(e => e[0] === k && e[1] === nk)) edges.push([k, nk]);
      c = nc;
    }
  }
  nodes.boss = { k: 'boss', f: FLOORS, c: 1.5, type: 'boss', jx: 0, jy: 0 };
  const weights = [['fight', 44], ['event', 20], ['elite', 12], ['shop', 9], ['forge', 8], ['altar', 7]];
  for (const n of Object.values(nodes)) {
    if (n.type) continue;
    if (n.f === 0) n.type = 'fight';
    else if (n.f === 4) n.type = 'chest';
    else if (n.f === FLOORS - 1) n.type = rng() < 0.5 ? 'forge' : 'shop';
    else {
      const pool = weights.filter(([t]) => !(t === 'elite' && n.f < 3) && !(t === 'shop' && n.f < 2));
      let tot = pool.reduce((a, [, w]) => a + w, 0), x = rng() * tot;
      for (const [t, w] of pool) { if ((x -= w) < 0) { n.type = t; break; } }
    }
  }
  return { nodes, edges };
}
function reachable(run) {
  const m = run.map;
  if (!run.pos) return Object.values(m.nodes).filter(n => n.f === 0).map(n => n.k);
  return m.edges.filter(e => e[0] === run.pos).map(e => e[1]);
}
function floorOf(run) { return run.pos ? run.map.nodes[run.pos].f : -1; }

function rewardSymbols(run) {
  const f = floorOf(run);
  const pool = [['sword', 26], ['shield', 18], ['fire', 22], ['coin', 22], ['gem', 8]];
  const out = [];
  while (out.length < 3) {
    let x = rng() * 96, t = 'sword';
    for (const [k, w] of pool) { if ((x -= w) < 0) { t = k; break; } }
    const lvl = rng() < 0.15 + f * 0.05 ? 1 : 0;
    if (out.some(o => o.t === t && o.lvl === lvl)) continue;
    out.push({ t, lvl });
  }
  return out;
}
function randomRelic(run) {
  const free = Object.keys(RELICS).filter(k => !run.relics.includes(k));
  return free.length ? pick(free) : null;
}

function tone(freq, dur, type = 'square', vol = 0.04, slide = 0, delay = 0) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);

    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}

  coin: () => { tone(988, 0.06, 'square', 0.03); tone(1319, 0.12, 'square', 0.03, 0, 0.06); },
  win:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, 'square', 0.035, 0, i * 0.07)),
  hurt: () => tone(110, 0.22, 'square', 0.06, -60),
  block:() => tone(600, 0.06, 'triangle', 0.06),
  die:  () => [400, 300, 200, 120].forEach((f, i) => tone(f, 0.12, 'square', 0.04, 0, i * 0.09)),
  click:() => tone(700, 0.03, 'square', 0.02),
};
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

const $ = s => document.querySelector(s);
const app = $('#app'), screen = $('#screen');
const SAVE = 'enarmad-hjalte-run-v1';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, reduced ? ms * 0.3 : ms));
let run = null, busy = false;

function save() { try { if (run) localStorage.setItem(SAVE, JSON.stringify(run)); else localStorage.removeItem(SAVE); } catch (e) {} }
function loadSave() { try { const s = localStorage.getItem(SAVE); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

$('#goldIcon').src = IMG.coin;
$('#bagIcon').src = IMG.bag;

function updateHud() {
  const hud = $('#hud');
  const show = run && !['title', 'class'].includes(run.screen);
  hud.hidden = !show;
  if (!show) return;
  $('#goldN').textContent = run.gold;
  $('#gold').classList.toggle('low', run.gold <= 9);
  const f = floorOf(run);
  $('#floorLbl').innerHTML = `${CLASSES[run.cls].name.toUpperCase()}<br>VÅNING ${Math.max(1, f + 1)}/${FLOORS + 1}`;
}

function floatAt(el, text, cls) {
  const a = app.getBoundingClientRect(), b = el.getBoundingClientRect();
  const s = document.createElement('div');
  s.className = 'float ' + cls;
  s.textContent = text;
  s.style.left = (b.left - a.left + b.width / 2 + (Math.random() - 0.5) * 20) + 'px';
  s.style.top = (b.top - a.top + b.height / 3) + 'px';
  app.appendChild(s);
  setTimeout(() => s.remove(), 1100);
}
function anim(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function go(screenName) { run.screen = screenName; save(); render(); }

function render() {
  updateHud();
  if (!run || run.screen === 'title') return renderTitle();
  const fn = { class: renderClass, map: renderMap, fight: renderFight, reward: renderReward, chest: renderChest,
               forge: renderForge, altar: renderAltar, shop: renderShop, event: renderEvent, over: renderOver, win: renderWin }[run.screen];
  (fn || renderMap)();
}

// ---------- map ----------
const ROOM = {
  fight:  { name: 'Strid',        icon: 'sword' },
  elite:  { name: 'Elit',         icon: 'skull' },
  chest:  { name: 'Skattkammare', icon: 'chest' },
  forge:  { name: 'Smedja',       icon: 'anvil' },
  shop:   { name: 'Handlare',     icon: 'bag' },
  altar:  { name: 'Altare',       icon: 'altar' },
  event:  { name: 'Mysterium',    icon: 'mystery' },
  boss:   { name: 'Draken',       icon: 'dragon' },
};
function renderMap() {
  const ROWH = 78, PAD = 52;
  const H = PAD * 2 + FLOORS * ROWH;
  const m = run.map, reach = reachable(run);
  const pos = n => ({ x: n.k === 'boss' ? 50 : ((n.c + 0.5 + n.jx) / COLS) * 100, y: H - PAD - n.f * ROWH + n.jy });
  const lines = m.edges.map(([a, b]) => {
    const A = pos(m.nodes[a]), B = pos(m.nodes[b]);
    const lit = (a === run.pos && reach.includes(b)) || (run.visited.includes(a) && run.visited.includes(b));
    return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${lit ? 'var(--brass)' : 'var(--line)'}" stroke-width="3" stroke-dasharray="${lit ? '0' : '6 6'}" vector-effect="non-scaling-stroke"/>`;
  }).join('');
  const nodes = Object.values(m.nodes).map(n => {
    const p = pos(n);
    const st = n.k === run.pos ? 'here' : reach.includes(n.k) ? 'reach' : run.visited.includes(n.k) ? 'done' : 'locked';
    const icon = ROOM[n.type].icon;
    return `<button class="node ${st} ${n.k === 'boss' ? 'boss' : ''}" data-k="${n.k}" style="left:${p.x}%;top:${p.y}px" aria-label="${ROOM[n.type].name}">${px(icon)}</button>`;
  }).join('');
  screen.innerHTML = `
    <div class="scr map">
      <div class="map-scroll" id="mapScroll">
        <div class="map-inner" style="height:${H}px">
          <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none">${lines}</svg>
          ${nodes}
        </div>
      </div>
      <div class="map-foot">
        <div class="legend">${['fight', 'elite', 'event', 'chest', 'forge', 'shop', 'altar'].map(t => `<span>${px(ROOM[t].icon)}${ROOM[t].name}</span>`).join('')}</div>
      </div>
    </div>`;
  screen.querySelectorAll('.node.reach').forEach(b => b.onclick = () => { sfx.click(); enterRoom(b.dataset.k); });
  const sc = $('#mapScroll');
  const cur = run.pos ? pos(m.nodes[run.pos]).y : H;
  sc.scrollTop = Math.max(0, cur - sc.clientHeight * 0.65);
}

function enterRoom(k) {
  const n = run.map.nodes[k];
  run.pos = k; run.visited.push(k);
  const f = n.f;
  switch (n.type) {
    case 'fight':  return startFight(pick(f <= 2 ? TIER1 : TIER2), 'fight');
    case 'elite':  return startFight('orc', 'elite');
    case 'boss':   return startFight('dragon', 'boss');
    case 'chest': {
      const relic = randomRelic(run);
      const chests = shuffle([
        relic ? { kind: 'relic', id: relic } : { kind: 'gold', v: 30 },
        { kind: 'gold', v: ri(18, 28) },
        { kind: 'syms', items: [{ t: 'gem', lvl: 0 }, { t: pick(['sword', 'fire', 'shield']), lvl: 1 }] },
      ]);
      run.room = { chests, picked: null };
      return go('chest');
    }
    case 'forge': {
      const idx = shuffle(run.bag.map((s, i) => i).filter(i => run.bag[i].t !== 'skull' && run.bag[i].lvl < MAX_LVL));
      const seen = new Set(), opts = [];
      for (const i of idx) { const s = run.bag[i]; const key = s.t + s.lvl; if (seen.has(key)) continue; seen.add(key); opts.push(i); if (opts.length === 3) break; }
      run.room = { opts, done: null };
      return go('forge');
    }
    case 'altar': run.room = { sel: null, done: null }; return go('altar');
    case 'shop': {
      const syms = rewardSymbols(run).map(s => ({ ...s, price: s.t === 'gem' ? 16 : 10 + s.lvl * 8, sold: false }));
      const relic = randomRelic(run);
      run.room = { syms, relic: relic ? { id: relic, price: 32, sold: false } : null, purge: { price: 12, sold: false }, msg: null };
      return go('shop');
    }
    case 'event': run.room = { id: pick(Object.keys(EVENTS)), result: null }; return go('event');
  }
}

// ---------- fight ----------
function startFight(id, kind) {
  run.fight = startFightState(run, id, kind);
  go('fight');
}
function cellHTML(s) {
  return `<div class="cell" data-t="${s.t}">${px(s.t, SYM[s.t].name)}${s.lvl ? `<i class="lv">+${s.lvl}</i>` : ''}${s.temp ? '<i class="tmp">TILLF</i>' : ''}</div>`;
}
function intentHTML(e) {
  const pips = Array.from({ length: e.every }, (_, i) => `<i class="${i < e.timer ? '' : 'off'}"></i>`).join('');
  const when = e.timer === 1 ? 'nästa snurr' : `om ${e.timer}`;
  return `${px('sword')}<span>${enemyAtk(e)}${e.curse ? ' +' : ''}</span>${e.curse ? px('skull') : ''}<span style="color:var(--muted)">${when}</span><span class="pips">${pips}</span>`;
}
function renderFight() {
  const f = run.fight, e = f.enemy;

  f.grid = grid;

  screen.innerHTML = `
    <div class="scr fight">
      <div class="stage" id="stage">
        <div class="ehead">
          <div class="ename"><span class="lbl">${kindLbl}${e.armor ? 'RUSTNING ' + e.armor + ' · ' : ''}</span>${e.name}</div>
          <div class="hpbar"><i id="hpFill" style="width:${(e.hp / e.maxHp) * 100}%"></i><b id="hpTxt">${e.hp}/${e.maxHp}</b></div>
          <div class="intent ${e.timer === 1 ? 'now' : ''}" id="intent">${intentHTML(e)}</div>
        </div>
        <div class="actor hero" id="hero">
          <div class="blockbadge" id="blockBadge" ${f.block ? '' : 'hidden'}>${px('shield')}<span id="blockN">${f.block}</span></div>
          <div class="sprite">${px(CLASSES[run.cls].sprite)}</div>
        </div>
        <div class="actor enemy ${e.big ? 'big' : ''}" id="enemy"><div class="sprite" style="${e.filter ? 'filter:' + e.filter : ''}">${px(e.sprite)}</div></div>
        <div class="banner" id="banner"></div>
      </div>
      <div class="machine">
        <div class="reels" id="reels">
          ${[0, 1, 2].map(c => `<div class="reel"><div class="strip" style="height:100%">${[0, 1, 2].map(r => cellHTML(grid[r][c]).replace('class="cell"', 'class="cell" style="height:33.333%"')).join('')}</div></div>`).join('')}
          <svg class="paylines" id="paylines" viewBox="0 0 300 300" preserveAspectRatio="none"></svg>
        </div>
      </div>
      <div class="log" id="log">${f.spins ? '' : `En <b>${e.name}</b> spärrar vägen. Varje snurr kostar guld, och guldet är ditt liv.`}</div>
      <button class="btn spin" id="spinBtn">SNURRA <small>−${Math.min(spinCost(run), run.gold)} ${px('coin')}</small></button>
    </div>`;
  $('#spinBtn').onclick = doSpin;
}

async function animateReels(grid, bag, prev) {
  const reels = [...document.querySelectorAll('.reel')];
  const jobs = reels.map((reel, c) => new Promise(resolve => {
    const fill = 9 + c * 4;
    const seq = [grid[0][c], grid[1][c], grid[2][c]];
    for (let i = 0; i < fill; i++) seq.push(pick(bag));
    seq.push(prev[0][c], prev[1][c], prev[2][c]);
    const len = seq.length;
    const strip = reel.querySelector('.strip');
    strip.style.transition = 'none';
    strip.style.height = (len / 3 * 100) + '%';
    strip.innerHTML = seq.map(s => cellHTML(s).replace('class="cell"', `class="cell" style="height:${100 / len}%"`)).join('');
    strip.style.transform = `translateY(-${((len - 3) / len) * 100}%)`;
    void strip.offsetHeight;
    const dur = (reduced ? 150 : 650) + c * (reduced ? 60 : 260);
    strip.style.transition = `transform ${dur}ms cubic-bezier(.22,.8,.3,1.06)`;
    strip.style.transform = 'translateY(0)';
    let ticks = 0;
    const tk = setInterval(() => { sfx.tick(); if (++ticks > dur / 70) clearInterval(tk); }, 70);
    setTimeout(() => {
      clearInterval(tk); sfx.stop();
      strip.style.transition = 'none'; strip.style.transform = 'none'; strip.style.height = '100%';
      strip.innerHTML = [0, 1, 2].map(r => cellHTML(grid[r][c]).replace('class="cell"', 'class="cell" style="height:33.333%"')).join('');
      resolve();
    }, dur + 30);
  }));
  await Promise.all(jobs);
}
function cellEl(r, c) { return document.querySelectorAll('.reel')[c].querySelectorAll('.cell')[r]; }
const LINE_COLOR = { sword: '#ffffff', fire: '#ef7d57', shield: '#41a6f6', coin: '#f0b648', gem: '#73eff7', skull: '#b13e53' };
function drawLines(lines) {
  const svg = $('#paylines');
  svg.innerHTML = lines.map(l => {
    const pts = LINES[l.i].map(([r, c]) => `${c * 100 + 50},${r * 100 + 50}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="#000" stroke-width="12" stroke-linecap="square" vector-effect="non-scaling-stroke" opacity="0.6"/>
            <polyline points="${pts}" fill="none" stroke="${LINE_COLOR[l.t]}" stroke-width="6" stroke-linecap="square" vector-effect="non-scaling-stroke"/>`;
  }).join('');
}
async function banner(text) {
  const b = $('#banner'); b.textContent = text; anim(b, 'show'); await sleep(520);
}

async function doSpin() {
  if (busy || !run.fight) return;
  busy = true;
  const btn = $('#spinBtn'); btn.disabled = true;
  const f = run.fight;
  const prevGrid = f.grid;
  const bag = run.bag.concat(f.temp);
  const hpBefore = f.enemy.hp;
  const goldBefore = run.gold;
  const res = applySpin(run, f);
  // show the paid cost immediately, then reveal the rest
  const shownGold = goldBefore - res.cost;
  $('#goldN').textContent = shownGold;
  floatAt($('#gold'), `−${res.cost}`, 'loss');
  $('#paylines').innerHTML = '';
  await animateReels(res.grid, bag, prevGrid);

  // highlight
  const winCells = new Set();
  res.lines.forEach(l => LINES[l.i].forEach(([r, c]) => winCells.add(r + ',' + c)));
  winCells.forEach(k => { const [r, c] = k.split(','); cellEl(+r, +c).classList.add('win'); });
  document.querySelectorAll('.cell').forEach(el => anim(el, 'pop'));
  drawLines(res.lines);
  if (res.storm) { sfx.big(); await banner('ELDSTORM!'); }
  for (const l of res.lines) { (l.t === 'skull' ? sfx.hurt : sfx.win)(); buzz(30); await banner(SYM[l.t].line); }

  // block
  if (res.block) {
    sfx.block();
    const bb = $('#blockBadge'); bb.hidden = false; $('#blockN').textContent = res.blockTotal;
    floatAt($('#hero'), `+${res.block}`, 'block');
  }
  // damage
  if (res.dmg > 0) {
    anim($('#hero'), 'lunge-r');
    await sleep(140);
    (res.dmg >= 12 ? sfx.big : sfx.hit)(); buzz(res.dmg >= 12 ? 60 : 20);
    anim($('#enemy'), 'hit');
    floatAt($('#enemy'), res.dmg, 'dmg');
    $('#hpFill').style.width = (f.enemy.hp / f.enemy.maxHp) * 100 + '%';
    $('#hpTxt').textContent = `${f.enemy.hp}/${f.enemy.maxHp}`;
  }
  // gold
  if (res.gold) {
    if (res.gold > 0) sfx.coin();
    floatAt($('#gold'), (res.gold > 0 ? '+' : '−') + Math.abs(res.gold), res.gold > 0 ? 'gold' : 'loss');
    $('#goldN').textContent = Math.max(0, shownGold + res.gold);
  }
  $('#log').innerHTML = spinLog(res, hpBefore);
  await sleep(380);

  if (res.killed) {
    sfx.die(); anim($('#enemy'), 'dead');
    await sleep(800);
    busy = false;
    return winFight();
  }
  if (res.enraged) { sfx.big(); await banner('DRAKEN RASAR!'); }
  if (res.enemy) {
    const a = res.enemy;
    anim($('#enemy'), 'lunge-l');
    await sleep(140);
    if (a.absorbed) { sfx.block(); floatAt($('#hero'), `BLOCK ${a.absorbed}`, 'block'); }
    if (a.taken) { sfx.hurt(); buzz(80); anim($('#hero'), 'hit'); floatAt($('#gold'), `−${a.taken}`, 'loss'); }
    $('#blockBadge').hidden = true;
    $('#log').innerHTML += `<br>${f.enemy.name} slår för <b>${a.atk}</b>${a.absorbed ? `, du blockerar ${a.absorbed}` : ''}.${a.curse ? ' En <b>dödskalle</b> läggs i din väska.' : ''}`;
    await sleep(350);
  }
  updateHud();
  const it = $('#intent'); it.innerHTML = intentHTML(f.enemy); it.classList.toggle('now', f.enemy.timer === 1);
  if (f.block) { $('#blockBadge').hidden = false; $('#blockN').textContent = f.block; }
  if (res.dead) {
    await sleep(500);
    busy = false;
    run.screen = 'over'; save(); return render();
  }
  save();
  btn.disabled = false;
  btn.querySelector('small').innerHTML = `−${Math.min(spinCost(run), run.gold)} ${px('coin')}`;
  busy = false;
}

function spinLog(res, hpBefore) {
  const parts = [];
  if (res.dmg) parts.push(`<b>${res.dmg}</b> skada`);
  if (res.block) parts.push(`<b>+${res.block}</b> block`);
  if (res.gold) parts.push(`<b>${res.gold > 0 ? '+' : '−'}${Math.abs(res.gold)}</b> guld`);
  if (!parts.length) return 'Ingenting. Automaten surrar tyst.';
  return parts.join(' · ') + (res.lines.length ? ` (${res.lines.length} vinstlinje${res.lines.length > 1 ? 'r' : ''})` : '');
}

function winFight() {
  const f = run.fight;
  run.stats.kills++;
  if (f.kind === 'boss') { run.fight = null; run.screen = 'win'; save(); return render(); }
  const gold = f.kind === 'elite' ? ri(18, 24) : ri(7, 12);
  run.gold += gold;
  let relic = null;
  if (f.kind === 'elite') { relic = randomRelic(run); if (relic) run.relics.push(relic); }
  run.room = { gold, relic, options: rewardSymbols(run), enemy: f.enemy.name };
  run.fight = null;
  go('reward');
}

const CHEST_LBL = ['Träkista', 'Silverkista', 'Guldkista'];
function chestContent(ch) {

  if (ch.kind === 'gold') return { icon: 'coin', title: `${ch.v} guld`, text: 'En hög med mynt.' };

function renderChest() {
  const R = run.room;
  screen.innerHTML = `
    <div class="scr room">
      <div class="head">${px('chest')}<div><h2>Skattkammaren</h2><p>Tre kistor. Du hinner bara öppna en innan golvet rasar.</p></div></div>
      <div class="tiles chest-row">
        ${R.chests.map((ch, i) => {
          const open = R.picked !== null;

          const mine = R.picked === i;
          return `<button class="tile ${open ? (mine ? 'sel open' : 'gone') : ''}" data-i="${i}" ${open ? 'disabled' : ''}>
            ${open ? px(c.icon) : px('chest')}
            <b>${open ? c.title : CHEST_LBL[i]}</b>
            <span>${open ? c.text : 'Vad finns i den?'}</span>
          </button>`;
        }).join('')}
      </div>
      ${R.picked !== null ? `<div class="result">Du tar <b>${chestContent(R.chests[R.picked]).title}</b>. De andra kistorna försvinner i mörkret.</div>` : ''}
      <div class="spacer"></div>
      ${R.picked !== null ? `<button class="btn" id="next">Vidare</button>` : ''}
    </div>`;
  if (R.picked === null) screen.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ch = R.chests[i];
    R.picked = i;
    if (ch.kind === 'relic') run.relics.push(ch.id);
    else if (ch.kind === 'gold') run.gold += ch.v;
    else ch.items.forEach(s => run.bag.push({ ...s }));
    sfx.win(); save(); render();
  });
  else $('#next').onclick = toMap;
}

// ---------- forge ----------
function renderForge() {
  const R = run.room;
  screen.innerHTML = `
    <div class="scr room">
      <div class="head">${px('anvil')}<div><h2>Smedjan</h2><p>Smeden vässar en av dina symboler. Bara en.</p></div></div>
      ${R.opts.length ? `<div class="tiles">${R.opts.map(i => {
        const s = run.bag[i];
        return `<button class="tile ${R.done === i ? 'sel' : R.done !== null ? 'gone' : ''}" data-i="${i}" ${R.done !== null ? 'disabled' : ''}>
          ${px(s.t)}<b>${SYM[s.t].name}${s.lvl ? ' +' + s.lvl : ''} → +${R.done === i ? s.lvl : s.lvl + 1}</b>
          <span>${symDesc(run, s.t, R.done === i ? s.lvl : s.lvl + 1)}</span></button>`;
      }).join('')}</div>` : `<div class="result">Du har inget kvar att uppgradera.</div>`}
      <p class="lbl">Uppgraderade symboler gör även vinstlinjer starkare.</p>
      <div class="spacer"></div>
      <button class="btn ${R.done !== null ? '' : 'ghost'}" id="next">${R.done !== null ? 'Vidare' : 'Gå därifrån'}</button>
    </div>`;
  if (R.done === null) screen.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    const i = +b.dataset.i; run.bag[i].lvl++; R.done = i; sfx.block(); sfx.win(); save(); render();
  });
  $('#next').onclick = toMap;
}

// ---------- altar ----------
function renderAltar() {
  const R = run.room;
  const order = ['skull', 'coin', 'shield', 'sword', 'fire', 'gem'];
  const idx = run.bag.map((s, i) => i).sort((a, b) => order.indexOf(run.bag[a].t) - order.indexOf(run.bag[b].t) || run.bag[a].lvl - run.bag[b].lvl);
  screen.innerHTML = `
    <div class="scr room">
      <div class="head">${px('altar')}<div><h2>Offeraltaret</h2><p>Lägg en symbol på altaret så försvinner den ur väskan för alltid. Färre symboler betyder att resten dyker upp oftare.</p></div></div>
      ${R.done ? `<div class="result">${R.done}</div>` : `
      <div class="bagrid">${idx.map(i => { const s = run.bag[i]; return `<button class="tile ${R.sel === i ? 'sel' : ''}" data-i="${i}">${px(s.t)}<span>${s.lvl ? '+' + s.lvl : '&nbsp;'}</span></button>`; }).join('')}</div>`}
      <div class="spacer"></div>
      ${R.done ? `<button class="btn" id="next">Vidare</button>` : `
        <button class="btn" id="offer" ${R.sel === null ? 'disabled' : ''}>${R.sel === null ? 'Välj en symbol' : 'Offra ' + SYM[run.bag[R.sel].t].name.toLowerCase()}</button>
        <button class="btn ghost" id="next">Gå därifrån</button>`}
    </div>`;
  if (!R.done) {
    screen.querySelectorAll('.bagrid .tile').forEach(b => b.onclick = () => { sfx.click(); R.sel = +b.dataset.i; render(); });
    $('#offer').onclick = () => {
      if (R.sel === null) return;
      const s = run.bag.splice(R.sel, 1)[0];
      R.done = `${SYM[s.t].name}${s.lvl ? ' +' + s.lvl : ''} brinner upp i en blå låga.`; R.sel = null;
      sfx.die(); save(); render();
    };
  }
  $('#next').onclick = toMap;
}

// ---------- shop ----------
function priceTag(p) { return `<span class="price">${p} ${px('coin')}</span>`; }
function renderShop() {
  const R = run.room;
  const can = p => run.gold > p;
  const skulls = run.bag.filter(s => s.t === 'skull').length;
  screen.innerHTML = `
    <div class="scr room">
      <div class="head">${px('bag')}<div><h2>Handlaren</h2><p>"Allt har ett pris, vandrare. Även ditt liv." Du kan inte köpa för ditt sista mynt.</p></div></div>
      <div class="lbl">Symboler</div>
      <div class="tiles">${R.syms.map((s, i) => symTile(s, s.sold ? '<span class="price">SÅLD</span>' : priceTag(s.price),
        `data-k="sym" data-i="${i}" ${s.sold || !can(s.price) ? 'disabled' : ''}`)).join('')}</div>
      <div class="lbl">Relik och tjänster</div>
      <div class="tiles">
        ${R.relic ? `<button class="tile" data-k="relic" ${R.relic.sold || !can(R.relic.price) ? 'disabled' : ''}>${px(RELICS[R.relic.id].icon)}<b>${RELICS[R.relic.id].name}</b><span>${RELICS[R.relic.id].desc}</span>${R.relic.sold ? '<span class="price">SÅLD</span>' : priceTag(R.relic.price)}</button>` : ''}
        <button class="tile" data-k="purge" ${R.purge.sold || !skulls || !can(R.purge.price) ? 'disabled' : ''}>${px('skull')}<b>Rensning</b><span>Ta bort en dödskalle (${skulls} kvar)</span>${R.purge.sold ? '<span class="price">KLAR</span>' : priceTag(R.purge.price)}</button>
      </div>
      ${R.msg ? `<div class="result">${R.msg}</div>` : ''}
      <div class="spacer"></div>
      <button class="btn" id="next">Lämna butiken</button>
    </div>`;
  screen.querySelectorAll('.tile[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'sym') { const s = R.syms[+b.dataset.i]; run.gold -= s.price; s.sold = true; run.bag.push({ t: s.t, lvl: s.lvl }); R.msg = `${SYM[s.t].name} ligger nu i din väska.`; }
    if (k === 'relic') { run.gold -= R.relic.price; R.relic.sold = true; run.relics.push(R.relic.id); R.msg = `${RELICS[R.relic.id].name} är din.`; }
    if (k === 'purge') { const i = run.bag.findIndex(s => s.t === 'skull'); if (i >= 0) run.bag.splice(i, 1); run.gold -= R.purge.price; R.purge.sold = true; R.msg = 'Dödskallen krossas till damm.'; }
    sfx.coin(); save(); render();
  });
  $('#next').onclick = toMap;
}

// ---------- events ----------
const EVENTS = {
  bandit: {
    title: 'Den enarmade banditen', icon: 'coin',
    text: 'En rostig spelautomat står ensam i grottan. Spaken är nött av tusen desperata händer.',
    choices: [
      { label: 'Dra i spaken (10 guld)', ok: r => r.gold > 10, run: r => { r.gold -= 10; if (rng() < 0.4) { r.gold += 32; return 'Tre körsbär! Automaten spottar ut 32 guld.'; } return 'Citron, plommon, dödskalle. Automaten skrattar metalliskt.'; } },
      { label: 'Gå förbi', run: () => 'Du lämnar automaten åt nästa stackare.' },
    ],
  },
  well: {
    title: 'Den förbannade brunnen', icon: 'skull',
    text: 'Guld glimmar på brunnens botten. En röst viskar: "Ta det. Allt har sitt pris."',
    choices: [
      { label: 'Ta guldet (+25 guld, +2 dödskallar)', run: r => { r.gold += 25; r.bag.push({ t: 'skull', lvl: 0 }, { t: 'skull', lvl: 0 }); return 'Mynten är kalla. Två dödskallar följer med upp ur brunnen.'; } },
      { label: 'Gå förbi', run: () => 'Viskningen tystnar bakom dig.' },
    ],
  },
  monk: {
    title: 'Den vandrande munken', icon: 'altar',
    text: '"Din väska luktar död, vän. För en liten gåva kan jag rena den, eller välsigna den."',
    choices: [
      { label: 'Rena (8 guld, ta bort en dödskalle)', ok: r => r.gold > 8 && r.bag.some(s => s.t === 'skull'), run: r => { r.gold -= 8; r.bag.splice(r.bag.findIndex(s => s.t === 'skull'), 1); return 'Munken mumlar en bön. Dödskallen är borta.'; } },
      { label: 'Välsigna (14 guld, få en juvel)', ok: r => r.gold > 14, run: r => { r.gold -= 14; r.bag.push({ t: 'gem', lvl: 0 }); return 'En juvel glöder i din väska.'; } },
      { label: 'Tacka nej', run: () => 'Munken nickar och vandrar vidare.' },
    ],
  },
  mule: {
    title: 'Den döda mulåsnan', icon: 'bag',
    text: 'En handelsmans mulåsna ligger död vid vägen. Sadelväskan är sprucken.',
    choices: [
      { label: 'Plocka upp mynten (+14 guld)', run: r => { r.gold += 14; return 'Fjorton mynt, lite blodiga.'; } },
      { label: 'Leta i väskan (en slumpad symbol)', run: r => { const s = rewardSymbols(r)[0]; r.bag.push(s); return `Du hittar en ${SYM[s.t].name.toLowerCase()}${s.lvl ? ' +' + s.lvl : ''}.`; } },
    ],
  },
  shrine: {
    title: 'Krigsgudens altare', icon: 'sword',
    text: 'Ett altare av svart sten. Inristat: "Blod för stål."',
    choices: [
      { label: 'Offra 15 guld: alla svärd +1', ok: r => r.gold > 15 && r.bag.some(s => s.t === 'sword' && s.lvl < MAX_LVL), run: r => { r.gold -= 15; r.bag.forEach(s => { if (s.t === 'sword' && s.lvl < MAX_LVL) s.lvl++; }); return 'Dina svärd glöder röda.'; } },
      { label: 'Gå förbi', run: () => 'Gudarna får vänta.' },
    ],
  },
};
function renderEvent() {
  const R = run.room, E = EVENTS[R.id];
  screen.innerHTML = `
    <div class="scr room">
      <div class="head">${px(E.icon)}<div><h2>${E.title}</h2></div></div>
      <p>${E.text}</p>
      ${R.result ? `<div class="result">${R.result}</div><div class="spacer"></div><button class="btn" id="next">Vidare</button>` : `
      <div class="spacer"></div>
      <div class="choices">${E.choices.map((c, i) => `<button class="btn ${i ? 'ghost' : ''}" data-i="${i}" ${c.ok && !c.ok(run) ? 'disabled' : ''}>${c.label}</button>`).join('')}</div>`}
    </div>`;
  if (R.result) $('#next').onclick = toMap;
  else screen.querySelectorAll('.choices .btn').forEach(b => b.onclick = () => {
    R.result = E.choices[+b.dataset.i].run(run); sfx.click(); save(); render();
  });
}

// ---------- end screens ----------
function endStats() {
  return `<div class="stats">
    <span>Klass</span><b>${CLASSES[run.cls].name}</b>
    <span>Våning</span><b>${floorOf(run) + 1}/${FLOORS + 1}</b>
    <span>Besegrade fiender</span><b>${run.stats.kills}</b>
    <span>Snurr</span><b>${run.stats.spins}</b>
    <span>Största träff</span><b>${run.stats.best}</b>
    <span>Symboler i väskan</span><b>${run.bag.length}</b>
    <span>Reliker</span><b>${run.relics.length}</b>
  </div>`;
}
function renderOver() {
  screen.innerHTML = `
    <div class="scr room title">
      <div class="trio">${px('skull')}</div>
      <h1 class="logo" style="font-size:44px">Pank<span>och död</span></h1>
      <p class="tagline">Ditt sista mynt rullade iväg. ${run.fight ? run.fight.enemy.name + ' tar resten.' : ''}</p>
      ${endStats()}
      <button class="btn" id="again">Ny runda</button>
    </div>`;
  $('#again').onclick = () => { run = { screen: 'class' }; save(); render(); };
}
function renderWin() {
  screen.innerHTML = `
    <div class="scr room title">
      <div class="trio">${px('dragon')}${px(CLASSES[run.cls].sprite)}${px('gem')}</div>
      <h1 class="logo" style="font-size:44px">Draken<span>är fälld</span></h1>
      <p class="tagline">Du lämnar grottan med ${run.gold} guld och en arm som värker.</p>
      ${endStats()}
      <button class="btn" id="again">Ny runda</button>
    </div>`;
  $('#again').onclick = () => { run = { screen: 'class' }; save(); render(); };
}

// ---------- modals ----------
function openModal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; $('#sheet').scrollTop = 0; }
$('#modalClose').onclick = () => { sfx.click(); $('#modal').hidden = true; };
function openBag() {
  if (!run || !run.bag) return;
  const bag = run.bag.concat(run.fight ? run.fight.temp : []);
  const groups = {};
  bag.forEach(s => { const k = s.t + '|' + s.lvl + '|' + (s.temp ? 1 : 0); groups[k] = (groups[k] || 0) + 1; });
  const rows = Object.entries(groups).sort((a, b) => b[1] - a[1]).map(([k, n]) => {
    const [t, lvl, tmp] = k.split('|');
    return `<div class="row">${px(t)}<p><b>${SYM[t].name}${+lvl ? ' +' + lvl : ''}${+tmp ? ' (tillfällig)' : ''}</b><br>${symDesc(run, t, +lvl)}</p><span class="n">${n}× · ${Math.round(n / bag.length * 100)}%</span></div>`;
  }).join('');
  const C = CLASSES[run.cls];
  openModal(`
    <h3>Väskan (${bag.length} symboler)</h3>
    <p class="txt">Varje ruta på hjulen dras slumpvis ur väskan. Procenten visar chansen per ruta.</p>
    ${rows}
    <h3>${C.name}</h3>
    <p class="txt">${C.passive}</p>
    <h3>Reliker</h3>
    ${run.relics.length ? run.relics.map(r => `<div class="row">${px(RELICS[r].icon)}<p><b>${RELICS[r].name}</b><br>${RELICS[r].desc}</p><span></span></div>`).join('') : '<p class="txt">Inga ännu. Hitta dem i kistor, hos handlaren eller hos elitfiender.</p>'}
    <button class="btn ghost" id="sound">${muted ? 'Slå på ljud' : 'Stäng av ljud'}</button>
    <button class="btn ghost" id="quit">Ge upp rundan</button>
  `);
  $('#sound').onclick = () => { muted = !muted; try { localStorage.setItem('eh-muted', muted ? '1' : '0'); } catch (e) {} openBag(); };
  $('#quit').onclick = () => {
    const b = $('#quit');
    if (b.dataset.sure) { $('#modal').hidden = true; run.screen = 'over'; save(); render(); }
    else { b.dataset.sure = '1'; b.textContent = 'Tryck igen för att ge upp'; }
  };
}
function openHelp() {
  const r = run && run.bag ? run : { cls: null, relics: [] };
  openModal(`
    <h3>Så spelar du</h3>
    <p class="txt"><b>Guld är ditt liv.</b> Varje snurr kostar ${SPIN_COST} guld. Når du 0 är rundan slut.</p>
    <p class="txt">Alla nio rutor gör något, även utan vinst. Ett svärd var som helst slår fienden.</p>
    <p class="txt">Tre lika på en linje (3 rader + 2 diagonaler) ger en <b>vinstlinje</b>: en kraftattack och guld. Juvelen är joker.</p>
    <p class="txt">Fienden visar när den slår till. Block från sköldar tar emot slaget och nollställs sedan.</p>
    <h3>Symboler</h3>
    ${Object.keys(SYM).map(t => `<div class="row">${px(t)}<p><b>${SYM[t].name}</b><br>${symDesc(r, t, 0)}</p><span></span></div>`).join('')}
    <h3>Vinstlinjer</h3>
    <div class="row">${px('sword')}<p><b>Power strike</b><br>6 skada genom rustning, +3 guld</p><span></span></div>
    <div class="row">${px('fire')}<p><b>Eldklot</b><br>6 skada genom rustning, +3 guld</p><span></span></div>
    <div class="row">${px('shield')}<p><b>Fästning</b><br>+5 block, +3 guld</p><span></span></div>
    <div class="row">${px('coin')}<p><b>Jackpott</b><br>+8 guld</p><span></span></div>
    <div class="row">${px('gem')}<p><b>Megajackpott</b><br>+20 guld</p><span></span></div>
    <div class="row">${px('skull')}<p><b>Förbannelse</b><br>−5 guld (juveler hjälper inte)</p><span></span></div>
    <p class="txt">Uppgraderade symboler (+1, +2) gör mer, och varje uppgradering på en vinstlinje ger +2 skada.</p>
    <h3>Kartan</h3>
    ${Object.entries(ROOM).map(([k, R]) => `<div class="row">${px(R.icon)}<p><b>${R.name}</b><br>${{
      fight: 'Vanlig fiende. Ger guld och en ny symbol.', elite: 'Tuff fiende som förbannar dig. Ger mer guld och en relik.',
      chest: 'Välj en av tre kistor.', forge: 'Uppgradera en symbol.', shop: 'Köp symboler och reliker för ditt liv.',
      altar: 'Ta bort en symbol ur väskan.', event: 'Något oväntat.', boss: 'Slutbossen.' }[k]}</p><span></span></div>`).join('')}
  `);
}
$('#bagBtn').onclick = () => { sfx.click(); openBag(); };
$('#helpBtn').onclick = () => { sfx.click(); openHelp(); };

// ---------- boot ----------
window.claude?.hot?.snapshot?.(() => ({ run }));
function start(data) {
  run = (data && data.run) || null;
  if (run && run.screen === 'fight' && !run.fight) run.screen = 'map';
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body></html>
