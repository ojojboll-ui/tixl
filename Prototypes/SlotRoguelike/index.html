<title>Enarmad Hjälte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#120e1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one portrait cabinet column. HUD, battle stage, LED strip, three reels with one lit payline, then bet / pocket / lever at thumb height. */
:root {
  --ink: #120e1c;
  --stone: #1e172e;
  --stone-2: #2b2242;
  --line: #43365f;
  --brass: #f0b648;
  --brass-dk: #9d6a1c;
  --parch: #f3e6c9;
  --muted: #a99cc6;
  --blood: #e8505f;
  --mana: #63b8ff;
  --leaf: #8adf6e;
  --hex: #c27ae0;
  --led: #ff5a3c;
  --display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --mono: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--parch);
  font-family: var(--display); font-size: 16px;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
[hidden] { display: none !important; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

#app {
  position: relative; height: 100%; max-width: 480px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px; box-sizing: border-box; overflow: hidden;
}

/* ---------- HUD ---------- */
.hud { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.gold { display: flex; align-items: center; gap: 6px; background: var(--stone-2); border: 2px solid var(--brass-dk);
  padding: 2px 10px 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 22px; color: var(--brass); font-variant-numeric: tabular-nums; }
.gold img { width: 28px; height: 28px; }
.gold small { font-size: 9px; color: var(--muted); letter-spacing: 0.08em; align-self: flex-end; margin-bottom: 4px; }
.gold.low { color: var(--blood); border-color: var(--blood); animation: throb 0.8s steps(2) infinite; }
.floor { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; flex: 1; text-align: center; line-height: 1.3; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; background: var(--stone-2); border: 2px solid var(--line);
  border-radius: 4px; padding: 0; font-family: var(--mono); font-size: 16px; }
.iconbtn img { width: 26px; height: 26px; }
.iconbtn:active { transform: translateY(2px); }
@keyframes throb { 50% { opacity: 0.55; } }

#screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scr { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
h2 { font-size: 24px; color: var(--brass); }
p { margin: 0; line-height: 1.4; }
.lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--brass); color: var(--ink);
  border: 0; border-radius: 4px; padding: 14px 18px; font-weight: 700; font-size: 18px;
  box-shadow: 0 5px 0 var(--brass-dk), inset 0 -3px 0 rgba(0,0,0,0.12); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--brass-dk); }
.btn.ghost { background: var(--stone-2); color: var(--parch); box-shadow: 0 5px 0 #0b0812; border: 2px solid var(--line); }
.btn:disabled { opacity: 0.45; transform: none; }
.btn img { width: 22px; height: 22px; }

/* ---------- Title ---------- */
.title { justify-content: center; text-align: center; gap: 20px; }
.logo { font-size: clamp(40px, 13vw, 58px); line-height: 0.92; color: var(--brass); text-shadow: 0 4px 0 var(--brass-dk), 0 8px 0 #000; }
.logo span { display: block; color: var(--parch); text-shadow: 0 4px 0 #6b5a3a, 0 8px 0 #000; }
.tagline { color: var(--muted); max-width: 32ch; margin: 0 auto; }
.trio { display: flex; justify-content: center; gap: 10px; }
.trio img { width: 72px; height: 72px; animation: bob 1.2s steps(2) infinite; }
.trio img:nth-child(2) { animation-delay: 0.4s; }
.trio img:nth-child(3) { animation-delay: 0.8s; }
.title .stack { display: grid; gap: 14px; }
@keyframes bob { 50% { transform: translateY(-4px); } }

/* ---------- Class select ---------- */
.cls-list { display: grid; gap: 10px; overflow-y: auto; min-height: 0; padding-bottom: 8px; }
.cls { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--stone); border: 2px solid var(--line); border-radius: 6px; padding: 10px; }
.cls:active, .cls:hover { border-color: var(--brass); }
.cls > img.px { width: 64px; height: 64px; }
.cls h3 { font-size: 20px; }
.cls p { font-size: 14px; color: var(--muted); margin-top: 2px; }
.cls .passive { color: var(--parch); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: var(--stone-2); border: 2px solid transparent; border-radius: 3px;
  padding: 1px 5px 1px 2px; font-family: var(--mono); font-size: 11px; color: var(--parch); }
.chip img { width: 18px; height: 18px; }
.chip.blank { color: var(--muted); padding-left: 6px; }
button.chip.sel { border-color: var(--brass); }

/* ---------- Map ---------- */
.map-scroll { flex: 1; min-height: 0; overflow-y: auto; border: 2px solid var(--line); border-radius: 6px;
  background: repeating-linear-gradient(0deg, transparent 0 22px, rgba(255,255,255,0.025) 22px 24px), var(--stone); }
.map-inner { position: relative; margin: 0 8px; }
.map-inner svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.node { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; padding: 0; display: grid; place-items: center;
  background: var(--stone-2); border: 2px solid var(--line); border-radius: 50%; }
.node img { width: 32px; height: 32px; }
.node.boss { width: 72px; height: 72px; margin: -36px 0 0 -36px; border-color: var(--blood); }
.node.boss img { width: 52px; height: 52px; }
.node.locked { opacity: 0.5; filter: grayscale(0.7); }
.node.done { opacity: 0.35; filter: grayscale(1); }
.node.here { border-color: var(--parch); opacity: 1; filter: none; }
.node.reach { border-color: var(--brass); box-shadow: 0 0 0 4px rgba(240,182,72,0.18); animation: pulse 0.9s steps(2) infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(240,182,72,0.32); } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.legend span { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); }
.legend img { width: 18px; height: 18px; }

/* ---------- Fight: stage ---------- */
.fight { gap: 8px; }
.stage { position: relative; height: clamp(140px, 23vh, 200px); flex: none; border: 2px solid var(--line); border-radius: 6px; overflow: hidden;
  background: linear-gradient(to bottom, transparent 72%, #17121f 72%, #17121f 74%, #251d35 74%),
    repeating-linear-gradient(90deg, #1b1529 0 30px, #1f182e 30px 32px), #1b1529; }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 10%, rgba(240,140,60,0.14), transparent 55%); }
.ehead { position: absolute; top: 6px; right: 8px; left: 44%; z-index: 2; display: grid; gap: 3px; }
.ename { font-size: 14px; text-align: right; font-weight: 600; line-height: 1.1; }
.hpbar { position: relative; height: 15px; background: #0b0812; border: 2px solid #000; border-radius: 2px; }
.hpbar i { position: absolute; inset: 0 auto 0 0; background: var(--blood); transition: width 0.25s steps(5); }
.hpbar b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 9px; font-weight: 400; color: #fff; text-shadow: 1px 1px 0 #000; }
.intent { justify-self: end; display: flex; align-items: center; gap: 5px; background: rgba(10,8,18,0.85); border: 1px solid var(--line);
  border-radius: 3px; padding: 2px 6px; font-size: 12px; line-height: 1.15; }
.intent img { width: 18px; height: 18px; }
.intent b { color: var(--blood); font-family: var(--mono); font-weight: 400; font-size: 12px; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 6px; height: 6px; background: var(--blood); }
.pips i.off { background: var(--line); }
.intent.now { border-color: var(--blood); animation: throb 0.5s steps(2) infinite; }
.actor { position: absolute; bottom: 18%; z-index: 1; }
.actor img { width: clamp(64px, 19vw, 84px); height: auto; }
.hero { left: 7%; }
.enemy { right: 8%; }
.enemy.big img { width: clamp(84px, 26vw, 110px); }
.actor .sprite { animation: bob 1s steps(2) infinite; }
.enemy .sprite { animation-delay: 0.5s; }
.blockbadge { position: absolute; left: -4px; top: -16px; display: flex; align-items: center; gap: 2px; font-family: var(--mono); font-size: 12px;
  color: var(--mana); background: rgba(10,8,18,0.85); border: 1px solid var(--mana); padding: 0 4px 0 1px; border-radius: 3px; white-space: nowrap; }
.blockbadge img { width: 18px; height: 18px; }
.lunge-r { animation: lungeR 0.28s steps(3); }
.lunge-l { animation: lungeL 0.28s steps(3); }
.hit { animation: hit 0.32s steps(4); }
@keyframes lungeR { 50% { transform: translateX(30px); } }
@keyframes lungeL { 50% { transform: translateX(-30px); } }
@keyframes hit { 0%, 100% { transform: translateX(0); filter: none; } 25% { transform: translateX(6px); filter: brightness(4) saturate(0); } 50% { transform: translateX(-6px); } 75% { transform: translateX(4px); filter: brightness(4) saturate(0); } }
.dead { animation: die 0.7s steps(6) forwards; }
@keyframes die { to { transform: translateY(20px) scaleY(0.2); opacity: 0; filter: brightness(3); } }
.banner { position: absolute; left: 0; right: 0; top: 36%; z-index: 3; text-align: center; pointer-events: none; display: grid; gap: 2px; opacity: 0; }
.banner b { font-size: 28px; font-weight: 700; color: var(--brass); text-shadow: 0 3px 0 #000, 0 0 14px rgba(240,182,72,0.55); }
.banner span { font-family: var(--mono); font-size: 12px; color: var(--parch); text-shadow: 1px 1px 0 #000; }
.banner.show { animation: banner 1.1s steps(9) forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(0.6); } 18% { opacity: 1; transform: scale(1.12); } 28% { transform: scale(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

/* ---------- Fight: machine ---------- */
.machine { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(#3a2a12, #2a1e0c); border: 3px solid var(--brass); border-radius: 8px;
  box-shadow: inset 0 0 0 3px #000, 0 4px 0 var(--brass-dk); padding: 6px 8px 8px; }
.led { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; background: #0a0505; border: 2px solid #000; border-radius: 3px; padding: 3px 6px; }
.led span { display: flex; flex-direction: column; align-items: center; font-family: var(--mono); font-size: 8px; color: #8a5a4a; letter-spacing: 0.08em; line-height: 1.1; }
.led b { font-family: var(--mono); font-weight: 400; font-size: 15px; color: var(--led); text-shadow: 0 0 6px rgba(255,90,60,0.6); font-variant-numeric: tabular-nums; }
.led b.hot { color: #ffd23c; text-shadow: 0 0 8px rgba(255,210,60,0.8); }
.reels { position: relative; flex: 1; min-height: 120px; max-height: 300px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.reel { position: relative; overflow: hidden; background: #f3e6c9; border-radius: 3px; box-shadow: inset 0 0 0 2px #000; }
.reel::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: linear-gradient(to bottom, rgba(18,14,28,0.72), rgba(18,14,28,0.45) 33.3%, transparent 33.4%, transparent 66.6%, rgba(18,14,28,0.45) 66.7%, rgba(18,14,28,0.72)); }
.reel.locked { box-shadow: inset 0 0 0 3px var(--brass); }
.strip { position: absolute; left: 0; right: 0; top: 0; height: 100%; will-change: transform; }
.cell { position: relative; display: grid; place-items: center; height: 33.333%; }
.cell img { height: 70%; width: auto; max-width: 86%; aspect-ratio: 1; }
.cell .lv { position: absolute; right: 3px; top: 3px; font-family: var(--mono); font-style: normal; font-size: 10px; color: #fff; background: var(--brass-dk); padding: 0 3px; border-radius: 2px; }
.cell .tmp { position: absolute; left: 3px; top: 3px; font-family: var(--mono); font-style: normal; font-size: 8px; color: #fff; background: var(--hex); padding: 0 3px; border-radius: 2px; }
.cell .pk { position: absolute; left: 3px; bottom: 3px; font-family: var(--mono); font-style: normal; font-size: 8px; color: var(--ink); background: var(--leaf); padding: 0 3px; border-radius: 2px; }
.cell.win { background: rgba(240,182,72,0.6); }
.cell.pop img { animation: pop 0.3s steps(3); }
@keyframes pop { 50% { transform: scale(1.25); } }
.payline { position: absolute; left: -8px; right: -8px; top: 33.333%; height: 33.333%; z-index: 3; pointer-events: none;
  border-top: 3px solid var(--brass); border-bottom: 3px solid var(--brass); box-sizing: border-box; }
.payline::before, .payline::after { content: ""; position: absolute; top: 50%; margin-top: -7px; border: 7px solid transparent; }
.payline::before { left: -3px; border-left-color: var(--brass); }
.payline::after { right: -3px; border-right-color: var(--brass); }
.payline.flash { animation: flash 0.25s steps(2) 4; }
@keyframes flash { 50% { border-color: #fff; } }
.tag { position: absolute; left: 50%; top: calc(66.666% - 9px); transform: translateX(-50%); z-index: 4; white-space: nowrap;
  font-family: var(--mono); font-size: 10px; line-height: 16px; padding: 0 5px; border-radius: 2px; color: #fff; background: #000; }
.tag:empty { display: none; }
.tag.dmg { background: var(--blood); }
.tag.block { background: #2a6fc0; }
.tag.hex { background: var(--hex); }
.tag.none { background: rgba(0,0,0,0.6); color: #bbb; }
.reel .tap { position: absolute; inset: 33.333% 0; z-index: 5; background: none; border: 0; padding: 0; }
.locks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.lockbtn { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; padding: 6px 0; background: #1a120a; color: var(--brass);
  border: 2px solid var(--brass-dk); border-radius: 3px; }
.lockbtn.on { background: var(--brass); color: var(--ink); border-color: var(--brass); }
.lockbtn.put { background: var(--leaf); color: var(--ink); border-color: var(--leaf); animation: throb 0.6s steps(2) infinite; }
.lockbtn:disabled { opacity: 0.35; }
.log { font-size: 13px; color: var(--muted); min-height: 2.7em; line-height: 1.35; text-align: center; }
.log b { color: var(--parch); font-weight: 600; }
.log .d { color: var(--blood); } .log .g { color: var(--brass); } .log .bl { color: var(--mana); }
.controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: stretch; }
.bet { display: grid; grid-template-columns: 44px 1fr 44px; align-items: stretch; background: var(--stone); border: 2px solid var(--line); border-radius: 4px; }
.bet button { background: var(--stone-2); border: 0; font-family: var(--mono); font-size: 20px; color: var(--brass); }
.bet button:disabled { opacity: 0.3; }
.bet div { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.bet b { font-family: var(--mono); font-weight: 400; font-size: 20px; color: var(--brass); }
.bet small { font-size: 10px; color: var(--muted); }
.pocket { display: flex; align-items: center; gap: 5px; background: var(--stone); border: 2px solid var(--line); border-radius: 4px; padding: 3px 6px; }
.pocket .lbl { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 8px; }
.slot { width: 42px; height: 42px; display: grid; place-items: center; padding: 0; background: #0f0b18; border: 2px dashed var(--line); border-radius: 3px; position: relative; }
.slot img { width: 32px; height: 32px; }
.slot.full { border-style: solid; border-color: var(--leaf); }
.slot.sel { background: var(--leaf); }
.slot.used { opacity: 0.4; }
.slot i { position: absolute; right: 1px; top: 0; font-family: var(--mono); font-style: normal; font-size: 9px; color: var(--brass); }
.spin { font-size: 22px; padding-block: 12px; letter-spacing: 0.04em; flex-direction: column; gap: 0; line-height: 1.1; }
.spin small { font-family: var(--mono); font-size: 11px; font-weight: 400; opacity: 0.8; letter-spacing: 0; }

.float { position: absolute; z-index: 20; pointer-events: none; font-family: var(--mono); font-size: 18px; text-shadow: 2px 2px 0 #000;
  transform: translate(-50%, -50%); animation: floatUp 1s steps(10) forwards; white-space: nowrap; }
.float.dmg { color: #fff; font-size: 24px; }
.float.gold { color: var(--brass); }
.float.loss { color: var(--blood); }
.float.block { color: var(--mana); }
@keyframes floatUp { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }
.shot { position: absolute; z-index: 15; width: 28px; height: 28px; pointer-events: none; margin: -14px 0 0 -14px; transition: transform 0.24s cubic-bezier(.5,0,.9,.6); }

/* ---------- Rooms ---------- */
.room { overflow-y: auto; padding-bottom: 8px; }
.room .head { display: flex; align-items: center; gap: 12px; }
.room .head img { width: 56px; height: 56px; flex: none; }
.room .head p { color: var(--muted); font-size: 15px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; background: var(--stone); border: 2px solid var(--line);
  border-radius: 6px; padding: 10px 6px; min-width: 0; }
.tile img.px { width: 48px; height: 48px; }
.tile b { font-size: 15px; }
.tile span { font-size: 12px; color: var(--muted); line-height: 1.25; }
.tile .price { font-family: var(--mono); font-size: 13px; color: var(--brass); display: inline-flex; align-items: center; gap: 2px; }
.tile .price img { width: 16px; height: 16px; }
.tile.sel { border-color: var(--brass); background: var(--stone-2); }
.tile.gone { opacity: 0.35; }
.tile:disabled { opacity: 0.4; }
.chest-row .tile img.px { width: 64px; height: 64px; }
.result { background: var(--stone-2); border-left: 4px solid var(--brass); padding: 10px 12px; border-radius: 3px; line-height: 1.4; }
.reelcards { display: grid; gap: 8px; }
.reelcard { display: grid; gap: 6px; text-align: left; background: var(--stone); border: 2px solid var(--line); border-radius: 6px; padding: 10px; }
button.reelcard:active, button.reelcard:hover { border-color: var(--brass); }
.reelcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.reelcard .top b { font-size: 16px; }
.reelcard .top span { font-size: 12px; color: var(--muted); }
.reelcard .note { font-size: 13px; color: var(--leaf); }
.choices { display: grid; gap: 12px; }
.spacer { flex: 1; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 16px; text-align: left; }
.stats b { font-family: var(--mono); color: var(--brass); font-weight: 400; }

/* ---------- Modal ---------- */
.modal { position: absolute; inset: 0; z-index: 50; background: rgba(8,6,14,0.9); display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
.sheet { flex: 1; min-height: 0; overflow-y: auto; background: var(--stone); border: 2px solid var(--line); border-radius: 8px; padding: 14px;
  display: grid; gap: 12px; align-content: start; }
.sheet h3 { color: var(--brass); font-size: 19px; margin-top: 4px; }
.sheet .txt { font-size: 15px; line-height: 1.45; }
.sheet .txt b { color: var(--brass); font-weight: 600; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.row .ic { display: flex; gap: 1px; }
.row .ic img { width: 22px; height: 22px; }
.row > img { width: 32px; height: 32px; }
.row p { font-size: 14px; color: var(--muted); line-height: 1.3; }
.row p b { color: var(--parch); font-weight: 600; }
.row .n { font-family: var(--mono); font-size: 12px; color: var(--brass); text-align: right; line-height: 1.3; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kpis div { background: var(--stone-2); border-radius: 4px; padding: 6px; text-align: center; }
.kpis b { display: block; font-family: var(--mono); font-weight: 400; font-size: 17px; color: var(--brass); }
.kpis span { font-size: 11px; color: var(--muted); }
.denoms { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.denoms div { background: var(--stone-2); border-radius: 3px; padding: 4px 0; text-align: center; font-family: var(--mono); font-size: 10px; color: var(--muted); line-height: 1.4; }
.denoms div b { display: block; color: var(--parch); font-weight: 400; font-size: 13px; }
.denoms div.on { outline: 2px solid var(--brass); }

function makeSprite(rows) {
  const N = 18, cv = document.createElement('canvas');
  cv.width = cv.height = N;
  const cx = cv.getContext('2d');
  const grid = Array.from({ length: N }, () => Array(N).fill(null));
  rows.forEach((row, r) => { for (let c = 0; c < 16; c++) { const ch = row[c]; if (ch && ch !== '.') grid[r + 1][c + 1] = PAL[ch]; } });
  const OUT = '#0d0a14';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (grid[r][c]) continue;
    let near = false;
    for (let dr = -1; dr <= 1 && !near; dr++) for (let dc = -1; dc <= 1; dc++) { if (grid[r + dr]?.[c + dc]) { near = true; break; } }
    if (near) { cx.fillStyle = OUT; cx.fillRect(c, r, 1, 1); }
  }
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c]) { cx.fillStyle = grid[r][c]; cx.fillRect(c, r, 1, 1); }
  return cv.toDataURL();
}

function evalLine(types) {
  const nonG = types.filter(t => t !== 'gem');
  if (!nonG.length) return 'gem3';
  if (nonG.every(t => t === nonG[0])) {
    const t = nonG[0];
    if (t === 'seven') return 'seven';
    if (t === 'bar') return 'bar';
    if (t === 'cherry') return 'cherry3';
    if (WEAPONS.includes(t)) return t;
  }
  const ch = types.filter(t => t === 'cherry').length;
  if (ch === 2) return 'cherry2';
  if (ch === 1) return 'cherry1';
  return null;
}
function counts(strip) { const c = {}; strip.forEach(s => { c[s.t] = (c[s.t] || 0) + 1; }); return c; }
// Exact enumeration of the payline over the reel strips (a PAR sheet in miniature).
function lineStats(strips, fixed = [null, null, null]) {
  const dists = strips.map((s, i) => fixed[i] ? [[fixed[i], 1]] : Object.entries(counts(s)).map(([t, n]) => [t, n / s.length]));
  let ev = 0, hit = 0, sq = 0;
  for (const [a, pa] of dists[0]) for (const [b, pb] of dists[1]) for (const [c, pc] of dists[2]) {
    const id = evalLine([a, b, c]);
    if (!id) continue;
    const p = pa * pb * pc, v = PAY[id].base;
    ev += p * v; hit += p; sq += p * v * v;
  }
  return { ev, hit, sq };
}
const has = (run, id) => run.relics.includes(id);
const rtpFor = (run, bet) => RTP_BY_BET[bet] + (has(run, 'screws') ? 0.015 : 0);
// The casino re-calibrates every pay so the machine always returns exactly its RTP.
const MEMO = new Map();
function machine(run, strips, bet) {
  const key = strips.map(s => JSON.stringify(counts(s))).join('|') + bet + run.relics.join();
  if (MEMO.has(key)) return MEMO.get(key);
  if (MEMO.size > 200) MEMO.clear();
  const st = lineStats(strips);
  const rtp = rtpFor(run, bet);
  const scale = rtp / st.ev;
  const sd = Math.sqrt(Math.max(0, st.sq * scale * scale - rtp * rtp));
  const out = { rtp, scale, hit: st.hit, sd };
  MEMO.set(key, out);
  return out;
}

  orc:      { name: 'Orkhövding',      sprite: 'orc',      hp: 55,  atk: 9,  every: 2, curse: true, big: true },

const TIER1 = ['slime', 'bat', 'goblin'];

function buildStrip(countsObj) {
  const syms = [], blanks = [];
  for (const t in countsObj) for (let i = 0; i < countsObj[t]; i++) (t === 'blank' ? blanks : syms).push({ t, lvl: 0 });
  shuffle(syms);

  const at = new Set(blanks.map((_, j) => Math.floor((j + 0.5) * n / blanks.length)));
  for (let i = 0; i < n; i++) out.push(at.has(i) && blanks.length ? blanks.pop() : syms.pop() || blanks.pop());

}

    const c = { ...base };
    for (const t in C.mod) c[t] = Math.max(0, (c[t] || 0) + C.mod[t]);
    return buildStrip(c);

}
const pocketCap = run => 1 + (run.cls === 'rogue' ? 1 : 0) + (has(run, 'silk') ? 1 : 0);

// --- Fight ------------------------------------------------------------
function makeEnemy(id) { const d = ENEMIES[id]; return { ...d, id, maxHp: d.hp, timer: d.every, enraged: false }; }
const enemyAtk = e => e.atk + (e.enraged ? e.enrage : 0);
function startFightState(run, id, kind) {

           lock: [false, false, false], lastLock: [false, false, false], pocketUse: null, pocketed: false, block: has(run, 'oak') ? 10 : 0, spins: 0 };
}
const mod = (i, n) => ((i % n) + n) % n;
const midSym = (f, c) => f.override[c] || f.strips[c][f.pos[c]];

}
function spinPrice(run, f, bet) {

  const minP = bet + Math.ceil(bet * LOCK_FEE * (has(run, 'clover') ? 0.5 : 1) * n);
  const total = Math.max(minP, Math.ceil(ev / m.rtp));   // a lock never beats the house

}
// One symbol on the payline, no combo: flat effect, the bet does not change it.
function cellFx(run, f, s, firesOnLine) {

  if (t === 'sword') {

    if (e.armor) { fx.dmg = Math.ceil(fx.dmg / 2); fx.half = true; }

    fx.dmg = 3 + s.lvl + (has(run, 'crystal') ? 1 : 0);

// Three of a weapon: the combo replaces the single effects. Same number as the payout, times the bet.
function powerFx(run, power, line, bet) {

function applySpin(run, f) {

  const pfx = power ? powerFx(run, power, line, bet) : null;

  const block = pfx ? pfx.block : cells.reduce((a, x) => a + x.block, 0);

  if (win > run.stats.bigWin) run.stats.bigWin = win;
  f.block += block;
  const e = f.enemy;
  e.hp = Math.max(0, e.hp - dmg);
  run.gold += win;
  const res = { bet, price, win, mult, payId, power, pfx, cells, dmg, block, rush, held, blockTotal: f.block };
  if (e.hp <= 0) { res.killed = true; return res; }
  if (e.enrage && !e.enraged && e.hp <= e.maxHp / 2) { e.enraged = true; res.enraged = true; }
  e.timer -= 1 + rush;
  if (e.timer <= 0) {

    const atk = enemyAtk(e);
    const absorbed = Math.min(f.block, atk), taken = atk - absorbed;

}

const FLOORS = 8, COLS = 4;
function genMap() {
  const nodes = {}, edges = [];
  const key = (f, c) => f + '-' + c;
  const mk = (f, c) => ({ k: key(f, c), f, c, type: null, jx: (rng() - 0.5) * 0.35, jy: (rng() - 0.5) * 18 });
  const starts = shuffle([0, 1, 2, 3]).slice(0, 3);
  starts.push(pick(starts));
  for (let c of starts) {
    for (let f = 0; f < FLOORS; f++) {
      const k = key(f, c);
      if (!nodes[k]) nodes[k] = mk(f, c);
      if (f === FLOORS - 1) { if (!edges.some(e => e[0] === k && e[1] === 'boss')) edges.push([k, 'boss']); break; }
      let nc = Math.max(0, Math.min(COLS - 1, c + ri(-1, 1)));
      const crosses = edges.some(([a, b]) => { const A = nodes[a], B = nodes[b]; return A && B && A.f === f && ((c < A.c && nc > B.c) || (c > A.c && nc < B.c)); });
      if (crosses) nc = c;
      const nk = key(f + 1, nc);
      if (!nodes[nk]) nodes[nk] = mk(f + 1, nc);
      if (!edges.some(e => e[0] === k && e[1] === nk)) edges.push([k, nk]);
      c = nc;
    }
  }
  nodes.boss = { k: 'boss', f: FLOORS, c: 1.5, type: 'boss', jx: 0, jy: 0 };
  const weights = [['fight', 44], ['event', 20], ['elite', 12], ['shop', 9], ['forge', 8], ['altar', 7]];
  for (const n of Object.values(nodes)) {
    if (n.type) continue;
    if (n.f === 0) n.type = 'fight';
    else if (n.f === 4) n.type = 'chest';
    else if (n.f === FLOORS - 1) n.type = rng() < 0.5 ? 'forge' : 'shop';
    else {
      const pool = weights.filter(([t]) => !(t === 'elite' && n.f < 3) && !(t === 'shop' && n.f < 2));
      let x = rng() * pool.reduce((a, [, w]) => a + w, 0);
      for (const [t, w] of pool) { if ((x -= w) < 0) { n.type = t; break; } }
    }
  }
  return { nodes, edges };
}
function reachable(run) {
  if (!run.pos) return Object.values(run.map.nodes).filter(n => n.f === 0).map(n => n.k);
  return run.map.edges.filter(e => e[0] === run.pos).map(e => e[1]);
}
const floorOf = run => run.pos ? run.map.nodes[run.pos].f : -1;
function rewardSymbols(run) {
  const f = floorOf(run);
  const pool = [['sword', 24], ['fire', 20], ['shield', 16], ['cherry', 12], ['bar', 10], ['seven', 5], ['gem', 6]];
  const tot = pool.reduce((a, [, w]) => a + w, 0);
  const out = [];
  for (let guard = 0; out.length < 3 && guard < 50; guard++) {
    let x = rng() * tot, t = 'sword';
    for (const [k, w] of pool) { if ((x -= w) < 0) { t = k; break; } }
    const lvl = WEAPONS.includes(t) && rng() < 0.15 + f * 0.05 ? 1 : 0;
    if (out.some(o => o.t === t && o.lvl === lvl)) continue;
    out.push({ t, lvl });

}

function tone(freq, dur, type = 'square', vol = 0.04, slide = 0, delay = 0) {

    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}

        { kind: 'gold', v: ri(20, 30) },
        { kind: 'syms', items: [{ t: 'gem', lvl: 0 }, { t: pick(WEAPONS), lvl: 1 }] },
      ]) };
      return go('chest');
    }
    case 'forge': {
      const all = [];
      run.strips.forEach((s, c) => s.forEach((x, i) => { if (WEAPONS.includes(x.t) && x.lvl < 2) all.push([c, i]); }));
      const seen = new Set(), opts = [];
      for (const [c, i] of shuffle(all)) { const x = run.strips[c][i], key = c + x.t + x.lvl; if (seen.has(key)) continue; seen.add(key); opts.push([c, i]); if (opts.length === 3) break; }
      run.room = { opts, done: null };
      return go('forge');
    }
    case 'altar': run.room = { sel: null, done: null }; return go('altar');
    case 'shop': {
      const PRICE = { sword: 10, fire: 10, shield: 8, cherry: 6, bar: 8, seven: 14, gem: 18 };
      const syms = rewardSymbols(run).map(s => ({ ...s, price: PRICE[s.t] + s.lvl * 8, sold: false }));
      const relic = randomRelic(run);
      run.room = { syms, relic: relic ? { id: relic, price: 40, sold: false } : null, purge: { price: 12, sold: false }, msg: null };
      return go('shop');
    }
    case 'event': run.room = { id: pick(Object.keys(EVENTS)), result: null }; return go('event');
  }
}

function drawReel(c) {

function refreshFight() {
  const f = run.fight, e = f.enemy;
  // keep the bet affordable
  const bets = betsFor(run);
  while (run.bet > run.gold && run.bet > 1) run.bet = bets[Math.max(0, bets.indexOf(run.bet) - 1)] || 1;
  const pr = spinPrice(run, f, run.bet);

    } else if (isPU) { b.textContent = 'FICKA ✕'; b.classList.add('on'); b.disabled = busy; }
    else if (f.lock[c]) { b.textContent = 'LÅST ✕'; b.classList.add('on'); b.disabled = busy; }
    else if (f.lastLock[c]) { b.textContent = 'VILAR'; b.disabled = true; }

  for (let i = 0; i < cap; i++) {

    const used = f.pocketUse && f.pocketUse.idx === i;
    ph += `<button class="slot ${s ? 'full' : ''} ${pocketSel === i ? 'sel' : ''} ${used ? 'used' : ''}" data-i="${i}" aria-label="${s ? SYM[s.t].name + ' i fickan' : 'Tom ficka'}">${s ? px(s.t) + (s.lvl ? `<i>+${s.lvl}</i>` : '') : ''}</button>`;
  }

  $('#pocket').querySelectorAll('.slot').forEach(b => b.onclick = () => onPocketSlot(+b.dataset.i));

    ? `SNURRA −${pr.total} GULD<small>${pr.n ? `insats ${run.bet} + lås ${pr.fee}` : `insats ${run.bet} · power strike ${12 * run.bet}`}</small>`

function changeBet(d) {

function onLock(c) {

async function animateReels(f, oldPos, held) {
  const reels = [...document.querySelectorAll('.reel')];
  await Promise.all(reels.map((reel, c) => new Promise(resolve => {
    if (held[c]) { drawReel(c); return resolve(); }
    const s = f.strips[c], n = s.length;
    const k = mod(oldPos[c] - f.pos[c], n) + n * (1 + Math.floor(c / 2));
    const seq = [];
    for (let j = 0; j < k + 3; j++) seq.push(s[mod(f.pos[c] - 1 + j, n)]);
    const len = seq.length;
    const strip = reel.querySelector('.strip');
    strip.style.transition = 'none';
    strip.style.height = (len / 3 * 100) + '%';
    strip.innerHTML = seq.map(x => cellHTML(x).replace('class="cell"', `class="cell" style="height:${100 / len}%"`)).join('');
    strip.style.transform = `translateY(-${(k / len) * 100}%)`;
    void strip.offsetHeight;
    const dur = (reduced ? 150 : 700) + c * (reduced ? 60 : 280);
    strip.style.transition = `transform ${dur}ms cubic-bezier(.2,.75,.3,1.05)`;
    strip.style.transform = 'translateY(0)';
    let ticks = 0;
    const tk = setInterval(() => { sfx.tick(); if (++ticks > dur / 70) clearInterval(tk); }, 70);
    setTimeout(() => { clearInterval(tk); sfx.stop(); drawReel(c); resolve(); }, dur + 30);
  })));
}
const midCell = c => document.querySelectorAll('.reel')[c].querySelectorAll('.cell')[1];
function showBanner(title, sub = '') {
  const b = $('#banner'); b.querySelector('b').textContent = title; b.querySelector('span').textContent = sub; anim(b, 'show');
}
async function countUp(el, to, hudFrom) {
  const steps = Math.min(16, to);
  for (let i = 1; i <= steps; i++) {
    const v = Math.round(to * i / steps);
    el.textContent = v; updateHud(hudFrom + v);
    if (i % 2) sfx.coin();
    await sleep(40);
  }
}

async function doSpin() {
  const f = run.fight;
  if (busy || !f) return;
  const pr = spinPrice(run, f, run.bet);
  if (pr.total > run.gold) return;
  busy = true; pocketSel = null;
  [0, 1, 2].forEach(c => { $('#tag' + c).textContent = ''; $('#tag' + c).className = 'tag'; });
  $('#ledWin').textContent = '0'; $('#ledWin').classList.remove('hot');
  $('#log').innerHTML = 'Hjulen snurrar…';
  refreshFight();
  const oldPos = [...f.pos];
  const goldBefore = run.gold;
  const hpBefore = f.enemy.hp;
  const res = applySpin(run, f);
  let shown = goldBefore - res.price;
  updateHud(shown);
  floatAt($('#gold'), `−${res.price}`, 'loss');
  await animateReels(f, oldPos, res.held);

  // 1. the combination
  if (res.payId) {
    const P = PAY[res.payId];
    [0, 1, 2].forEach(c => midCell(c).classList.add('win'));
    anim($('#payline'), 'flash');
    if (res.power) { sfx.big(); buzz(80); showBanner(P.name + '!', res.pfx.dmg ? `${res.pfx.dmg} skada (${PAY[res.power].base} × insats ${res.bet})` : `+${res.pfx.block} block (${PAY[res.power].base} × insats ${res.bet})`); await sleep(1000); }
    else if (res.payId === 'gem3' || res.payId === 'seven') { sfx.jackpot(); buzz(200); showBanner('JACKPOTT!', P.name); await sleep(1000); }
  }
  // 2. the payline acts: a power combo as one big blow, otherwise each symbol left to right
  if (res.power) {
    [0, 1, 2].forEach(c => { anim(midCell(c), 'pop'); $('#tag' + c).textContent = 'POWER'; $('#tag' + c).className = 'tag ' + (res.pfx.dmg ? 'dmg' : 'block'); });
    if (res.pfx.dmg) {
      anim($('#hero'), 'lunge-r');
      await Promise.all([0, 1, 2].map(c => fly(midCell(c), $('#enemy'), res.power)));
      sfx.big(); buzz(120); anim($('#enemy'), 'hit'); anim($('#stage'), 'hit');
      floatAt($('#enemy'), res.pfx.dmg, 'dmg');
    } else { sfx.block(); floatAt($('#hero'), `+${res.pfx.block}`, 'block'); await sleep(300); }
  } else for (let c = 0; c < 3; c++) {
    const fx = res.cells[c], cell = midCell(c), tag = $('#tag' + c);
    anim(cell, 'pop');
    if (fx.dmg) {
      tag.textContent = `${fx.dmg} SKADA${fx.half ? ' (½)' : ''}`; tag.className = 'tag dmg';
      anim($('#hero'), 'lunge-r');
      await fly(cell, $('#enemy'), fx.t);
      sfx.hit(); buzz(15);
      anim($('#enemy'), 'hit'); floatAt($('#enemy'), fx.dmg, 'dmg');
    } else if (fx.block) {
      tag.textContent = `+${fx.block} BLOCK`; tag.className = 'tag block';
      sfx.block(); floatAt($('#hero'), `+${fx.block}`, 'block');
      await sleep(200);
    } else if (fx.rush) {
      tag.textContent = 'SKYNDAR'; tag.className = 'tag hex';
      sfx.hurt(); anim($('#intent'), 'hit');
      await sleep(250);
    } else { tag.textContent = '–'; tag.className = 'tag none'; await sleep(90); }
  }
  // enemy hp after all hits
  $('#hpFill').style.width = (f.enemy.hp / f.enemy.maxHp) * 100 + '%';
  $('#hpTxt').textContent = `${f.enemy.hp}/${f.enemy.maxHp}`;
  if (res.block) { $('#blockBadge').hidden = false; $('#blockN').textContent = `${res.blockTotal} BLOCK`; }
  // 3. the payout
  if (res.win) {
    if (!res.power && !['gem3', 'seven'].includes(res.payId)) sfx.win();
    $('#ledWin').classList.add('hot');
    floatAt($('#gold'), `+${res.win}`, 'gold');
    await countUp($('#ledWin'), res.win, shown);
    shown += res.win;
  }
  $('#log').innerHTML = spinLog(res);
  await sleep(250);

  if (res.killed) {
    sfx.die(); anim($('#enemy'), 'dead');
    await sleep(800);
    busy = false;
    return winFight();
  }
  if (res.enraged) { sfx.big(); showBanner('DRAKEN RASAR!', 'anfallet +' + f.enemy.enrage); await sleep(900); }
  if (res.enemy) {
    const a = res.enemy;
    anim($('#enemy'), 'lunge-l'); await sleep(140);
    if (a.absorbed) { sfx.block(); floatAt($('#hero'), `BLOCK ${a.absorbed}`, 'block'); }
    if (a.taken) { sfx.hurt(); buzz(90); anim($('#hero'), 'hit'); floatAt($('#gold'), `−${a.taken}`, 'loss'); }
    $('#log').innerHTML += `<br>${f.enemy.name} anfaller: <b class="d">−${a.atk}</b>${a.absorbed ? `, block tar <b class="bl">${a.absorbed}</b>` : ''}.` +
      (a.curseReel !== null ? ` En <b>dödskalle</b> hamnar på hjul ${a.curseReel + 1}.` : '');
    await sleep(350);
  }
  updateHud();
  if (res.dead) { await sleep(500); busy = false; run.screen = 'over'; save(); return render(); }
  busy = false;

  refreshFight();
}
function spinLog(res) {
  const P = res.payId ? PAY[res.payId] : null;
  let out = P ? `<b>${P.name}</b> ${fmtMult(res.mult)} × insats ${res.bet} = <b class="g">+${res.win} guld</b>` : `Ingen vinst. Insatsen ${res.bet} är förlorad.`;
  const bits = [];
  if (res.power) bits.push(res.pfx.dmg ? `<b class="d">${res.pfx.dmg} skada</b> (${PAY[res.power].base}${has(run, 'rage') ? '×2' : ''} × ${res.bet})` : `<b class="bl">+${res.pfx.block} block</b>`);
  else {
    if (res.dmg) bits.push(`<b class="d">${res.dmg} skada</b>`);
    if (res.block) bits.push(`<b class="bl">+${res.block} block</b>`);
    if (res.rush) bits.push(`<b>fienden skyndar</b>`);
  }
  return out + (bits.length ? '<br>' + bits.join(' · ') : '');
}
function winFight() {
  const f = run.fight;
  run.stats.kills++;
  if (f.kind === 'boss') { run.fight = null; run.screen = 'win'; save(); return render(); }
  const gold = f.kind === 'elite' ? ri(20, 28) : ri(8, 13);
  run.gold += gold;
  let relic = null;
  if (f.kind === 'elite') { relic = randomRelic(run); if (relic) run.relics.push(relic); }
  run.room = { gold, relic, options: rewardSymbols(run), enemy: f.enemy.name };
  run.fight = null;
  go('reward');
}

          <div class="chips">${reelChips(strip)}</div>
          <div class="note">Chans på linjen: ${pct(before)} → ${pct(after)}${blank ? '' : ' · hjulet blir längre'}</div>
        </button>`; }).join('')}</div>
    </div>`;
  screen.querySelectorAll('.reelcard').forEach(b => b.onclick = () => {
    placeOnReel(run.strips, +b.dataset.c, s); run.place.shift(); sfx.lock();
    if (run.place.length) { save(); render(); }
    else if (run.placeBack === 'map') toMap();
    else go(run.placeBack);
  });
}

// ---------- chest ----------
const CHEST_LBL = ['Träkista', 'Silverkista', 'Guldkista'];
function chestContent(ch) {
  if (ch.kind === 'relic') return { icon: RELICS[ch.id].icon, title: RELICS[ch.id].name, text: RELICS[ch.id].desc };
  if (ch.kind === 'gold') return { icon: 'coin', title: `${ch.v} guld`, text: 'En hög med mynt.' };
  return { icon: ch.items[0].t, title: 'Symbolpaket', text: ch.items.map(s => SYM[s.t].name + (s.lvl ? ' +' + s.lvl : '')).join(' och ') };
}
function renderChest() {
  const R = run.room, open = R.picked !== null;
  screen.innerHTML = `
    <div class="scr room">
      <div class="head">${px('chest')}<div><h2>Skattkammaren</h2><p>Tre kistor. Du hinner öppna en innan golvet rasar.</p></div></div>
      <div class="tiles chest-row">${R.chests.map((ch, i) => { const c = chestContent(ch), mine = R.picked === i;
        return `<button class="tile ${open ? (mine ? 'sel' : 'gone') : ''}" data-i="${i}" ${open ? 'disabled' : ''}>${open ? px(c.icon) : px('chest')}
          <b>${open ? c.title : CHEST_LBL[i]}</b><span>${open ? c.text : 'Vad finns i den?'}</span></button>`; }).join('')}</div>
      ${open ? `<div class="result">Du tar <b>${chestContent(R.chests[R.picked]).title}</b>. De andra kistorna försvinner i mörkret.</div>` : ''}
      <div class="spacer"></div>
      ${open ? `<button class="btn" id="next">Vidare</button>` : ''}
    </div>`;
  if (!open) screen.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ch = R.chests[i];
    R.picked = i;
    if (ch.kind === 'relic') run.relics.push(ch.id);
    else if (ch.kind === 'gold') run.gold += ch.v;
    sfx.win(); save(); render();
  });
  else $('#next').onclick = () => { const ch = R.chests[R.picked]; if (ch.kind === 'syms') queuePlace(ch.items, 'map'); else toMap(); };
}

// ---------- forge ----------
function renderForge() {
  const R = run.room;
  screen.innerHTML = `
    <div class="scr room">
      <div class="head">${px('anvil')}<div><h2>Smedjan</h2><p>Smeden vässar ett vapen på dina hjul. Bara ett.</p></div></div>
      ${R.opts.length ? `<div class="tiles">${R.opts.map(([c, i], k) => { const s = run.strips[c][i], done = R.done === k, nl = done ? s.lvl : s.lvl + 1;
        return `<button class="tile ${done ? 'sel' : R.done !== null ? 'gone' : ''}" data-k="${k}" ${R.done !== null ? 'disabled' : ''}>
          ${px(s.t)}<b>${SYM[s.t].name} +${nl}</b><span>Hjul ${c + 1}</span><span>${symDesc(s.t, nl)}</span></button>`; }).join('')}</div>`
        : `<div class="result">Du har inga vapen kvar att uppgradera.</div>`}
      <p class="lbl">Uppgraderingar ger mer skada eller block. De ändrar inte vinsttabellen.</p>
      <div class="spacer"></div>
      <button class="btn ${R.done !== null ? '' : 'ghost'}" id="next">${R.done !== null ? 'Vidare' : 'Gå därifrån'}</button>
    </div>`;
  if (R.done === null) screen.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, [c, i] = R.opts[k]; run.strips[c][i].lvl++; R.done = k; sfx.win(); save(); render();
  });
  $('#next').onclick = toMap;
}

// ---------- altar ----------
function renderAltar() {
  const R = run.room;
  screen.innerHTML = `
    <div class="scr room">
      <div class="head">${px('altar')}<div><h2>Offeraltaret</h2><p>Offra ett stopp från ett hjul. Hjulet blir kortare och resten av symbolerna landar oftare på linjen.</p></div></div>
      ${R.done ? `<div class="result">${R.done}</div>` : `<div class="reelcards">${run.strips.map((strip, c) => `
        <div class="reelcard"><div class="top"><b>Hjul ${c + 1}</b><span>${strip.length} stopp${strip.length <= MIN_STOPS ? ' · minimum' : ''}</span></div>
        <div class="chips" data-c="${c}">${reelChips(strip, { button: true, sel: R.sel && R.sel[0] === c ? R.sel[1] : null })}</div></div>`).join('')}</div>`}
      <div class="spacer"></div>
      ${R.done ? `<button class="btn" id="next">Vidare</button>` : `
        <button class="btn" id="offer" ${R.sel ? '' : 'disabled'}>${R.sel ? `Offra ${SYM[R.sel[1]].name.toLowerCase()} från hjul ${R.sel[0] + 1}` : 'Välj en symbol'}</button>
        <button class="btn ghost" id="next">Gå därifrån</button>`}
    </div>`;
  if (!R.done) {
    screen.querySelectorAll('.chips[data-c] .chip').forEach(b => b.onclick = () => {
      const c = +b.parentElement.dataset.c;
      if (run.strips[c].length <= MIN_STOPS) return;
      R.sel = [c, b.dataset.t]; sfx.click(); render();
    });
    $('#offer').onclick = () => {
      const [c, t] = R.sel, strip = run.strips[c];
      let idx = -1;
      strip.forEach((s, i) => { if (s.t === t && (idx < 0 || s.lvl < strip[idx].lvl)) idx = i; });
      strip.splice(idx, 1);
      R.done = `${SYM[t].name} på hjul ${c + 1} brinner upp i en blå låga. Hjulet har nu ${strip.length} stopp.`; R.sel = null;
      sfx.die(); save(); render();
    };
  }
  $('#next').onclick = toMap;
}

// ---------- shop ----------
const priceTag = p => `<span class="price">${p} ${px('coin')}</span>`;
function renderShop() {
  const R = run.room, can = p => run.gold > p;
  const skulls = run.strips.flat().filter(s => s.t === 'skull').length;
  screen.innerHTML = `
    <div class="scr room">
      <div class="head">${px('bag')}<div><h2>Handlaren</h2><p>"Allt har ett pris, vandrare. Även ditt liv." Du kan inte betala med ditt sista mynt.</p></div></div>
      <div class="lbl">Symboler (du väljer hjul efter köpet)</div>
      <div class="tiles">${R.syms.map((s, i) => symTile(s, s.sold ? '<span class="price">SÅLD</span>' : priceTag(s.price), `data-k="sym" data-i="${i}" ${s.sold || !can(s.price) ? 'disabled' : ''}`)).join('')}</div>
      <div class="lbl">Relik och tjänster</div>
      <div class="tiles">
        ${R.relic ? `<button class="tile" data-k="relic" ${R.relic.sold || !can(R.relic.price) ? 'disabled' : ''}>${px(RELICS[R.relic.id].icon)}<b>${RELICS[R.relic.id].name}</b><span>${RELICS[R.relic.id].desc}</span>${R.relic.sold ? '<span class="price">SÅLD</span>' : priceTag(R.relic.price)}</button>` : ''}
        <button class="tile" data-k="purge" ${R.purge.sold || !skulls || !can(R.purge.price) ? 'disabled' : ''}>${px('skull')}<b>Rensning</b><span>Byt en dödskalle mot en tom ruta (${skulls} kvar)</span>${R.purge.sold ? '<span class="price">KLAR</span>' : priceTag(R.purge.price)}</button>
      </div>
      ${R.msg ? `<div class="result">${R.msg}</div>` : ''}
      <div class="spacer"></div>
      <button class="btn" id="next">Lämna butiken</button>
    </div>`;
  screen.querySelectorAll('.tile[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    sfx.coin();
    if (k === 'sym') { const s = R.syms[+b.dataset.i]; run.gold -= s.price; s.sold = true; R.msg = null; return queuePlace([s], 'shop'); }
    if (k === 'relic') { run.gold -= R.relic.price; R.relic.sold = true; run.relics.push(R.relic.id); R.msg = `${RELICS[R.relic.id].name} är din.`; }
    if (k === 'purge') {
      for (const strip of run.strips) { const i = strip.findIndex(s => s.t === 'skull'); if (i >= 0) { strip[i] = { t: 'blank', lvl: 0 }; break; } }
      run.gold -= R.purge.price; R.purge.sold = true; R.msg = 'Dödskallen krossas till damm.';
    }
    save(); render();
  });
  $('#next').onclick = toMap;
}

      { label: 'Gå förbi', run: () => 'Gudarna får vänta.' } ] },
};
function renderEvent() {
  const R = run.room, E = EVENTS[R.id];

    <div class="scr room">
      <div class="head">${px(E.icon)}<div><h2>${E.title}</h2></div></div>

      ${R.result ? `<div class="result">${R.result}</div><div class="spacer"></div><button class="btn" id="next">${R.place ? 'Välj hjul' : 'Vidare'}</button>` : `
      <div class="spacer"></div>
      <div class="choices">${E.choices.map((c, i) => `<button class="btn ${i ? 'ghost' : ''}" data-i="${i}" ${c.ok && !c.ok(run) ? 'disabled' : ''}>${c.label}</button>`).join('')}</div>`}

}

// ---------- modals ----------
function openModal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; $('#sheet').scrollTop = 0; }
$('#modalClose').onclick = () => { sfx.click(); $('#modal').hidden = true; };
function openMachine() {
  if (!run || !run.cls) return openHelp();
  const strips = run.fight ? run.fight.strips : run.strips;
  const bet = run.bet, m = machine(run, strips, bet);
  const rows = PAYS.map(P => {
    const mult = P.base * m.scale;
    const power = P.power ? `<br>${P.power === 'shield' ? 'block' : 'skada'}: ${P.base * (has(run, 'rage') ? 2 : 1)} × insats = ${P.base * (has(run, 'rage') ? 2 : 1) * bet}` : '';
    return `<div class="row"><div class="ic">${P.icons.map(t => px(t)).join('')}</div><p><b>${P.name}</b>${power}</p><span class="n">${fmtMult(mult)}<br>${Math.round(mult * bet)} guld</span></div>`;
  }).join('');
  const C = CLASSES[run.cls];
  openModal(`
    <h3>Automaten</h3>
    <div class="kpis">
      <div><b>${pct(m.rtp)}</b><span>RTP</span></div>
      <div><b>${pct(m.hit)}</b><span>träffrekvens</span></div>
      <div><b>${volLabel(m.sd)}</b><span>volatilitet</span></div>
    </div>
    <p class="txt">RTP betyder att automaten i snitt betalar tillbaka <b>${pct(m.rtp)}</b> av allt du satsar. Resten, ${pct(1 - m.rtp)}, är husets fördel. Siffrorna räknas exakt fram ur dina hjul.</p>
    <h3>Insats och RTP</h3>
    <div class="denoms">${BETS.map(b => `<div class="${b === bet ? 'on' : ''} ${betsFor(run).includes(b) ? '' : 'lockd'}"><b>${b}</b>${pct(rtpFor(run, b)).replace(' %', '%')}</div>`).join('')}</div>
    <p class="txt">Som i riktiga kasinon betalar högre valörer tillbaka mer. Men en hög insats tömmer ditt liv fortare när det går dåligt.</p>
    <h3>Vinsttabell vid insats ${bet}</h3>
    ${rows}
    <p class="txt">Bara mittenraden räknas. Jokern ersätter allt. Kasinot kalibrerar om tabellen varje gång hjulen ändras.</p>
    <h3>Dina hjul${run.fight ? ' (med förbannelser)' : ''}</h3>
    ${strips.map((s, c) => `<div><div class="lbl">Hjul ${c + 1} · ${s.length} stopp</div><div class="chips">${reelChips(s)}</div></div>`).join('')}
    <h3>${C.name}</h3>
    <p class="txt">${C.passive}</p>
    <h3>Reliker</h3>
    ${run.relics.length ? run.relics.map(r => `<div class="row">${px(RELICS[r].icon)}<p><b>${RELICS[r].name}</b><br>${RELICS[r].desc}</p><span></span></div>`).join('') : '<p class="txt">Inga ännu. De finns i kistor, hos handlaren och hos elitfiender.</p>'}
    <button class="btn ghost" id="sound">${muted ? 'Slå på ljud' : 'Stäng av ljud'}</button>
    <button class="btn ghost" id="quit">Ge upp rundan</button>
  `);
  $('#sound').onclick = () => { muted = !muted; try { localStorage.setItem('eh-muted', muted ? '1' : '0'); } catch (e) {} openMachine(); };
  $('#quit').onclick = () => {
    const b = $('#quit');
    if (b.dataset.sure) { $('#modal').hidden = true; busy = false; run.screen = 'over'; save(); render(); }
    else { b.dataset.sure = '1'; b.textContent = 'Tryck igen för att ge upp'; }
  };
}
function openHelp() {
  openModal(`
    <h3>Så spelar du</h3>
    <p class="txt"><b>1. Guld är ditt liv.</b> Du satsar ditt liv på varje snurr. Når du 0 är rundan slut.</p>
    <p class="txt"><b>2. Satsa.</b> Insatsen multiplicerar vinster och power-kombos. Den ändrar inte vanliga attacker. Låg insats är säkert och segt, hög insats är en chansning på stora slag.</p>
    <p class="txt"><b>3. Snurra.</b> Tre riktiga hjul med fasta remsor. <b>Bara mittenraden</b> räknas.</p>
    <p class="txt"><b>4. Attack.</b> Varje vapen på linjen gör sin effekt direkt, även utan vinst: svärd och eld 3 skada, sköld 4 block.</p>
    <p class="txt"><b>5. Power strike.</b> Tre likadana vapen (jokern räknas) gör en kombo i stället: <b>12 × insatsen</b> i skada, plus en utbetalning. Eldklot gör samma sak genom rustning, Fästning ger 8 × insatsen i block.</p>
    <p class="txt"><b>6. Vinst.</b> Kombinationerna i vinsttabellen betalar ut guld. Automaten betalar i snitt tillbaka 94–97 %. Huset vinner alltid på sikt.</p>
    <p class="txt"><b>7. Fienden</b> visar när den anfaller och hur mycket guld den tar. Block tar emot slaget och försvinner sedan. Dödskallar på linjen får fienden att anfalla tidigare.</p>
    <p class="txt"><b>8. Lås.</b> Lås upp till två hjul så att de står kvar nästa snurr. Låset kostar minst halva insatsen per hjul, och mer om låset ger chans till en storvinst. Ett hjul kan inte låsas två gånger i rad.</p>
    <p class="txt"><b>9. Fickan.</b> Tryck på en symbol på linjen för att spara den. Lägg den på valfritt hjul senare, när det passar. Den räknas som ett lås.</p>
    <h3>Symboler</h3>
    ${['sword', 'fire', 'shield', 'cherry', 'bar', 'seven', 'gem', 'skull', 'blank'].map(t => `<div class="row">${t === 'blank' ? '<span style="width:32px"></span>' : px(t)}<p><b>${SYM[t].name}</b><br>${symDesc(t, 0)}</p><span></span></div>`).join('')}
    <h3>Kartan</h3>
    ${Object.entries(ROOM).map(([k, R]) => `<div class="row">${px(R.icon)}<p><b>${R.name}</b><br>${{
      fight: 'Vanlig fiende. Ger hittelön och en ny symbol.', elite: 'Tuff fiende som förbannar dina hjul. Ger mer guld och en relik.',
      chest: 'Välj en av tre kistor.', forge: 'Uppgradera ett vapen.', shop: 'Köp symboler och reliker för ditt liv.',
      altar: 'Ta bort ett stopp från ett hjul.', event: 'Något oväntat.', boss: 'Slutbossen.' }[k]}</p><span></span></div>`).join('')}
  `);
}
$('#machBtn').onclick = () => { sfx.click(); openMachine(); };
$('#helpBtn').onclick = () => { sfx.click(); openHelp(); };

// ---------- boot ----------
window.claude?.hot?.snapshot?.(() => ({ run }));
function start(data) {
  run = (data && data.run) || null;
  if (run && run.screen === 'fight' && !run.fight) run.screen = 'map';
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
