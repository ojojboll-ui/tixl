<title>One-Armed Hero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#120e1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one portrait cabinet column. HUD, battle stage, LED strip, five reels with one lit payline, then bet / nudges / pocket / lever at thumb height. */
:root {
  --ink: #120e1c;
  --stone: #1e172e;
  --stone-2: #2b2242;
  --line: #43365f;
  --brass: #f0b648;
  --brass-dk: #9d6a1c;
  --parch: #f3e6c9;
  --muted: #a99cc6;
  --blood: #e8505f;
  --mana: #63b8ff;
  --leaf: #8adf6e;
  --hex: #c27ae0;
  --led: #ff5a3c;
  --display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --mono: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--parch);
  font-family: var(--display); font-size: 16px;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
[hidden] { display: none !important; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

#app {
  position: relative; height: 100%; max-width: 480px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px; box-sizing: border-box; overflow: hidden;
}

/* ---------- HUD ---------- */
.hud { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.gold { display: flex; align-items: center; gap: 6px; background: var(--stone-2); border: 2px solid var(--brass-dk);
  padding: 2px 10px 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 22px; color: var(--brass); font-variant-numeric: tabular-nums; }
.gold img { width: 28px; height: 28px; }
.gold small { font-size: 9px; color: var(--muted); letter-spacing: 0.08em; align-self: flex-end; margin-bottom: 4px; }
.gold.low { color: var(--blood); border-color: var(--blood); animation: throb 0.8s steps(2) infinite; }
.floor { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; flex: 1; text-align: center; line-height: 1.3; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; background: var(--stone-2); border: 2px solid var(--line);
  border-radius: 4px; padding: 0; font-family: var(--mono); font-size: 16px; }
.iconbtn img { width: 26px; height: 26px; }
.iconbtn:active { transform: translateY(2px); }
@keyframes throb { 50% { opacity: 0.55; } }

#screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scr { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
h2 { font-size: 24px; color: var(--brass); }
p { margin: 0; line-height: 1.4; }
.lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--brass); color: var(--ink);
  border: 0; border-radius: 4px; padding: 14px 18px; font-weight: 700; font-size: 18px;
  box-shadow: 0 5px 0 var(--brass-dk), inset 0 -3px 0 rgba(0,0,0,0.12); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--brass-dk); }
.btn.ghost { background: var(--stone-2); color: var(--parch); box-shadow: 0 5px 0 #0b0812; border: 2px solid var(--line); }
.btn:disabled { opacity: 0.45; transform: none; }
.btn img { width: 22px; height: 22px; }

/* ---------- Title ---------- */
.title { justify-content: center; text-align: center; gap: 20px; }
.logo { font-size: clamp(40px, 13vw, 58px); line-height: 0.92; color: var(--brass); text-shadow: 0 4px 0 var(--brass-dk), 0 8px 0 #000; }
.logo span { display: block; color: var(--parch); text-shadow: 0 4px 0 #6b5a3a, 0 8px 0 #000; }
.tagline { color: var(--muted); max-width: 32ch; margin: 0 auto; }
.trio { display: flex; justify-content: center; gap: 10px; }
.trio img { width: 72px; height: 72px; animation: bob 1.2s steps(2) infinite; }
.trio img:nth-child(2) { animation-delay: 0.4s; }
.trio img:nth-child(3) { animation-delay: 0.8s; }
.title .stack { display: grid; gap: 14px; }
@keyframes bob { 50% { transform: translateY(-4px); } }

/* ---------- Class select ---------- */
.cls-list { display: grid; gap: 10px; overflow-y: auto; min-height: 0; padding-bottom: 8px; }
.cls { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--stone); border: 2px solid var(--line); border-radius: 6px; padding: 10px; }
.cls:active, .cls:hover { border-color: var(--brass); }
.cls > img.px { width: 64px; height: 64px; }
.cls h3 { font-size: 20px; }
.cls p { font-size: 14px; color: var(--muted); margin-top: 2px; }
.cls .passive { color: var(--parch); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: var(--stone-2); border: 2px solid transparent; border-radius: 3px;
  padding: 1px 5px 1px 2px; font-family: var(--mono); font-size: 11px; color: var(--parch); }
.chip img { width: 18px; height: 18px; }
.chip.blank { color: var(--muted); padding-left: 6px; }
button.chip.sel { border-color: var(--brass); }

/* ---------- Map ---------- */
.map-scroll { flex: 1; min-height: 0; overflow-y: auto; border: 2px solid var(--line); border-radius: 6px;
  background: repeating-linear-gradient(0deg, transparent 0 22px, rgba(255,255,255,0.025) 22px 24px), var(--stone); }
.map-inner { position: relative; margin: 0 8px; }
.map-inner svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.node { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; padding: 0; display: grid; place-items: center;
  background: var(--stone-2); border: 2px solid var(--line); border-radius: 50%; }
.node img { width: 32px; height: 32px; }
.node.boss { width: 72px; height: 72px; margin: -36px 0 0 -36px; border-color: var(--blood); }
.node.boss img { width: 52px; height: 52px; }
.node.locked { opacity: 0.5; filter: grayscale(0.7); }
.node.done { opacity: 0.35; filter: grayscale(1); }
.node.here { border-color: var(--parch); opacity: 1; filter: none; }
.node.reach { border-color: var(--brass); box-shadow: 0 0 0 4px rgba(240,182,72,0.18); animation: pulse 0.9s steps(2) infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(240,182,72,0.32); } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.legend span { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); }
.legend img { width: 18px; height: 18px; }

/* ---------- Fight: stage ---------- */
.fight { gap: 8px; }
.stage { position: relative; height: clamp(140px, 23vh, 200px); flex: none; border: 2px solid var(--line); border-radius: 6px; overflow: hidden;
  background: linear-gradient(to bottom, transparent 72%, #17121f 72%, #17121f 74%, #251d35 74%),
    repeating-linear-gradient(90deg, #1b1529 0 30px, #1f182e 30px 32px), #1b1529; }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 10%, rgba(240,140,60,0.14), transparent 55%); }
.ehead { position: absolute; top: 6px; right: 8px; left: 44%; z-index: 2; display: grid; gap: 3px; }
.ename { font-size: 14px; text-align: right; font-weight: 600; line-height: 1.1; }
.hpbar { position: relative; height: 15px; background: #0b0812; border: 2px solid #000; border-radius: 2px; }
.hpbar i { position: absolute; inset: 0 auto 0 0; background: var(--blood); transition: width 0.25s steps(5); }
.hpbar b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 9px; font-weight: 400; color: #fff; text-shadow: 1px 1px 0 #000; }
.intent { justify-self: end; display: flex; align-items: center; gap: 5px; background: rgba(10,8,18,0.85); border: 1px solid var(--line);
  border-radius: 3px; padding: 2px 6px; font-size: 12px; line-height: 1.15; }
.intent img { width: 18px; height: 18px; }
.intent b { color: var(--blood); font-family: var(--mono); font-weight: 400; font-size: 12px; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 6px; height: 6px; background: var(--blood); }
.pips i.off { background: var(--line); }
.intent.now { border-color: var(--blood); animation: throb 0.5s steps(2) infinite; }
.actor { position: absolute; bottom: 18%; z-index: 1; }
.actor img { width: clamp(64px, 19vw, 84px); height: auto; }
.hero { left: 7%; }
.enemy { right: 8%; }
.enemy.big img { width: clamp(84px, 26vw, 110px); }
.actor .sprite { animation: bob 1s steps(2) infinite; }
.enemy .sprite { animation-delay: 0.5s; }
.blockbadge { position: absolute; left: -4px; top: -16px; display: flex; align-items: center; gap: 2px; font-family: var(--mono); font-size: 12px;
  color: var(--mana); background: rgba(10,8,18,0.85); border: 1px solid var(--mana); padding: 0 4px 0 1px; border-radius: 3px; white-space: nowrap; }
.blockbadge img { width: 18px; height: 18px; }
.lunge-r { animation: lungeR 0.28s steps(3); }
.lunge-l { animation: lungeL 0.28s steps(3); }
.hit { animation: hit 0.32s steps(4); }
@keyframes lungeR { 50% { transform: translateX(30px); } }
@keyframes lungeL { 50% { transform: translateX(-30px); } }
@keyframes hit { 0%, 100% { transform: translateX(0); filter: none; } 25% { transform: translateX(6px); filter: brightness(4) saturate(0); } 50% { transform: translateX(-6px); } 75% { transform: translateX(4px); filter: brightness(4) saturate(0); } }
.dead { animation: die 0.7s steps(6) forwards; }
@keyframes die { to { transform: translateY(20px) scaleY(0.2); opacity: 0; filter: brightness(3); } }
.banner { position: absolute; left: 0; right: 0; top: 36%; z-index: 3; text-align: center; pointer-events: none; display: grid; gap: 2px; opacity: 0; }
.banner b { font-size: 28px; font-weight: 700; color: var(--brass); text-shadow: 0 3px 0 #000, 0 0 14px rgba(240,182,72,0.55); }
.banner span { font-family: var(--mono); font-size: 12px; color: var(--parch); text-shadow: 1px 1px 0 #000; }
.banner.show { animation: banner 1.1s steps(9) forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(0.6); } 18% { opacity: 1; transform: scale(1.12); } 28% { transform: scale(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

/* ---------- Fight: machine ---------- */
.machine { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(#3a2a12, #2a1e0c); border: 3px solid var(--brass); border-radius: 8px;
  box-shadow: inset 0 0 0 3px #000, 0 4px 0 var(--brass-dk); padding: 6px 8px 8px; }
.led { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; background: #0a0505; border: 2px solid #000; border-radius: 3px; padding: 3px 6px; }
.led span { display: flex; flex-direction: column; align-items: center; font-family: var(--mono); font-size: 8px; color: #8a5a4a; letter-spacing: 0.08em; line-height: 1.1; }
.led b { font-family: var(--mono); font-weight: 400; font-size: 15px; color: var(--led); text-shadow: 0 0 6px rgba(255,90,60,0.6); font-variant-numeric: tabular-nums; }
.led b.hot { color: #ffd23c; text-shadow: 0 0 8px rgba(255,210,60,0.8); }
.reels { position: relative; flex: 1; min-height: 120px; max-height: 260px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.reel { position: relative; overflow: hidden; background: #f3e6c9; border-radius: 3px; box-shadow: inset 0 0 0 2px #000; }
.reel::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: linear-gradient(to bottom, rgba(18,14,28,0.72), rgba(18,14,28,0.45) 33.3%, transparent 33.4%, transparent 66.6%, rgba(18,14,28,0.45) 66.7%, rgba(18,14,28,0.72)); }
.reel.locked { box-shadow: inset 0 0 0 3px var(--brass); }
.strip { position: absolute; left: 0; right: 0; top: 0; height: 100%; will-change: transform; }
.cell { position: relative; display: grid; place-items: center; height: 33.333%; }
.cell img { height: 66%; width: auto; max-width: 88%; aspect-ratio: 1; }
.cell .lv { position: absolute; right: 2px; top: 2px; font-family: var(--mono); font-style: normal; font-size: 9px; color: #fff; background: var(--brass-dk); padding: 0 3px; border-radius: 2px; }
.cell .tmp { position: absolute; left: 3px; top: 3px; font-family: var(--mono); font-style: normal; font-size: 8px; color: #fff; background: var(--hex); padding: 0 3px; border-radius: 2px; }
.cell .pk { position: absolute; left: 3px; bottom: 3px; font-family: var(--mono); font-style: normal; font-size: 8px; color: var(--ink); background: var(--leaf); padding: 0 3px; border-radius: 2px; }
.cell.win { background: rgba(240,182,72,0.6); }
.cell.pop img { animation: pop 0.3s steps(3); }
@keyframes pop { 50% { transform: scale(1.25); } }
.payline { position: absolute; left: -8px; right: -8px; top: 33.333%; height: 33.333%; z-index: 3; pointer-events: none;
  border-top: 3px solid var(--brass); border-bottom: 3px solid var(--brass); box-sizing: border-box; }
.payline::before, .payline::after { content: ""; position: absolute; top: 50%; margin-top: -7px; border: 7px solid transparent; }
.payline::before { left: -3px; border-left-color: var(--brass); }
.payline::after { right: -3px; border-right-color: var(--brass); }
.payline.flash { animation: flash 0.25s steps(2) 4; }
@keyframes flash { 50% { border-color: #fff; } }
.tag { position: absolute; left: 50%; top: calc(66.666% - 8px); transform: translateX(-50%); z-index: 4; white-space: nowrap;
  font-family: var(--mono); font-size: 8px; line-height: 14px; padding: 0 3px; border-radius: 2px; color: #fff; background: #000; }
.tag:empty { display: none; }
.tag.dmg { background: var(--blood); }
.tag.block { background: #2a6fc0; }
.tag.hex { background: var(--hex); }
.tag.none { background: rgba(0,0,0,0.6); color: #bbb; }
.reel .tap { position: absolute; left: 0; right: 0; height: 33.333%; z-index: 5; background: none; border: 0; padding: 0; }
.reel .tap.top { top: 0; } .reel .tap.mid { top: 33.333%; } .reel .tap.bot { top: 66.666%; }
.reel.nudgeable .cell:nth-child(1), .reel.nudgeable .cell:nth-child(3) { outline: 2px dashed var(--leaf); outline-offset: -4px; animation: throb 0.7s steps(2) infinite; }
.reel.nudgeable .cell:nth-child(1)::after { content: "▼"; position: absolute; bottom: 1px; font-size: 10px; color: var(--leaf); z-index: 3; }
.reel.nudgeable .cell:nth-child(3)::after { content: "▲"; position: absolute; top: 1px; font-size: 10px; color: var(--leaf); z-index: 3; }
.locks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.lockbtn { font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; padding: 6px 0; background: #1a120a; color: var(--brass);
  border: 2px solid var(--brass-dk); border-radius: 3px; }
.lockbtn.on { background: var(--brass); color: var(--ink); border-color: var(--brass); }
.lockbtn.put { background: var(--leaf); color: var(--ink); border-color: var(--leaf); animation: throb 0.6s steps(2) infinite; }
.lockbtn:disabled { opacity: 0.35; }
.log { font-size: 13px; color: var(--muted); min-height: 2.7em; line-height: 1.35; text-align: center; }
.log b { color: var(--parch); font-weight: 600; }
.log .d { color: var(--blood); } .log .g { color: var(--brass); } .log .bl { color: var(--mana); }
.controls { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: stretch; }
.nudges { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 52px; background: var(--stone); border: 2px solid var(--line); border-radius: 4px; padding: 2px 4px; }
.nudges .lbl { font-size: 8px; }
.nudges b { font-family: var(--mono); font-weight: 400; font-size: 20px; color: var(--leaf); }
.nudges.live { border-color: var(--leaf); animation: throb 0.7s steps(2) infinite; }
.nudges.pop, #nudges.pop { animation: pop 0.3s steps(3); }
.bet { display: grid; grid-template-columns: 40px 1fr 40px; align-items: stretch; background: var(--stone); border: 2px solid var(--line); border-radius: 4px; }
.bet button { background: var(--stone-2); border: 0; font-family: var(--mono); font-size: 20px; color: var(--brass); }
.bet button:disabled { opacity: 0.3; }
.bet div { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.bet b { font-family: var(--mono); font-weight: 400; font-size: 20px; color: var(--brass); }
.bet small { font-size: 10px; color: var(--muted); }
.pocket { display: flex; align-items: center; gap: 5px; background: var(--stone); border: 2px solid var(--line); border-radius: 4px; padding: 3px 6px; }
.pocket .lbl { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 8px; }
.slot { width: 40px; height: 40px; display: grid; place-items: center; padding: 0; background: #0f0b18; border: 2px dashed var(--line); border-radius: 3px; position: relative; }
.slot img { width: 32px; height: 32px; }
.slot.full { border-style: solid; border-color: var(--leaf); }
.slot.sel { background: var(--leaf); }
.slot.used { opacity: 0.4; }
.slot i { position: absolute; right: 1px; top: 0; font-family: var(--mono); font-style: normal; font-size: 9px; color: var(--brass); }
.spin { font-size: 22px; padding-block: 12px; letter-spacing: 0.04em; flex-direction: column; gap: 0; line-height: 1.1; }
.spin small { font-family: var(--mono); font-size: 10px; font-weight: 400; opacity: 0.8; letter-spacing: 0; }
.spin.collect { background: var(--leaf); box-shadow: 0 5px 0 #4f8a3a; }
.shake { animation: hit 0.32s steps(4); }
.pt { display: grid; grid-template-columns: 28px repeat(5, 1fr); gap: 4px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--brass); text-align: center; font-variant-numeric: tabular-nums; }
.pt img { width: 24px; height: 24px; }
.pt.head { color: var(--muted); font-size: 10px; }

.float { position: absolute; z-index: 20; pointer-events: none; font-family: var(--mono); font-size: 18px; text-shadow: 2px 2px 0 #000;
  transform: translate(-50%, -50%); animation: floatUp 1s steps(10) forwards; white-space: nowrap; }
.float.dmg { color: #fff; font-size: 24px; }
.float.gold { color: var(--brass); }
.float.loss { color: var(--blood); }
.float.block { color: var(--mana); }
@keyframes floatUp { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }
.shot { position: absolute; z-index: 15; width: 28px; height: 28px; pointer-events: none; margin: -14px 0 0 -14px; transition: transform 0.24s cubic-bezier(.5,0,.9,.6); }

/* ---------- Rooms ---------- */
.room { overflow-y: auto; padding-bottom: 8px; }
.room .head { display: flex; align-items: center; gap: 12px; }
.room .head img { width: 56px; height: 56px; flex: none; }
.room .head p { color: var(--muted); font-size: 15px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; background: var(--stone); border: 2px solid var(--line);
  border-radius: 6px; padding: 10px 6px; min-width: 0; }
.tile img.px { width: 48px; height: 48px; }
.tile b { font-size: 15px; }
.tile span { font-size: 12px; color: var(--muted); line-height: 1.25; }
.tile .price { font-family: var(--mono); font-size: 13px; color: var(--brass); display: inline-flex; align-items: center; gap: 2px; }
.tile .price img { width: 16px; height: 16px; }
.tile.sel { border-color: var(--brass); background: var(--stone-2); }
.tile.gone { opacity: 0.35; }
.tile:disabled { opacity: 0.4; }
.chest-row .tile img.px { width: 64px; height: 64px; }
.result { background: var(--stone-2); border-left: 4px solid var(--brass); padding: 10px 12px; border-radius: 3px; line-height: 1.4; }
.reelcards { display: grid; gap: 8px; }
.reelcard { display: grid; gap: 6px; text-align: left; background: var(--stone); border: 2px solid var(--line); border-radius: 6px; padding: 10px; }
button.reelcard:active, button.reelcard:hover { border-color: var(--brass); }
.reelcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.reelcard .top b { font-size: 16px; }
.reelcard .top span { font-size: 12px; color: var(--muted); }
.reelcard .note { font-size: 13px; color: var(--leaf); }
.choices { display: grid; gap: 12px; }
.spacer { flex: 1; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 16px; text-align: left; }
.stats b { font-family: var(--mono); color: var(--brass); font-weight: 400; }

/* ---------- Modal ---------- */
.modal { position: absolute; inset: 0; z-index: 50; background: rgba(8,6,14,0.9); display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }

function makeSprite(rows) {
  const N = 18, cv = document.createElement('canvas');
  cv.width = cv.height = N;
  const cx = cv.getContext('2d');
  const grid = Array.from({ length: N }, () => Array(N).fill(null));

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (grid[r][c]) continue;
    let near = false;
    for (let dr = -1; dr <= 1 && !near; dr++) for (let dc = -1; dc <= 1; dc++) { if (grid[r + dr]?.[c + dc]) { near = true; break; } }
    if (near) { cx.fillStyle = OUT; cx.fillRect(c, r, 1, 1); }
  }
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c]) { cx.fillStyle = grid[r][c]; cx.fillRect(c, r, 1, 1); }

}

// Best left-to-right run on the payline. Wilds substitute for anything.
function evalLine(types) {
  let lead = 0; while (lead < types.length && types[lead] === 'gem') lead++;
  let best = lead >= 3 ? { t: 'gem', n: lead, base: PAYTABLE.gem[lead] } : null;
  for (const t of PAY_ORDER) {
    if (t === 'gem') continue;
    let n = 0; while (n < types.length && (types[n] === t || types[n] === 'gem')) n++;
    if (n === lead) continue;
    const base = PAYTABLE[t][n];
    if (base && (!best || base > best.base)) best = { t, n, base };
  }
  return best;
}
function counts(strip) { const c = {}; strip.forEach(s => { c[s.t] = (c[s.t] || 0) + 1; }); return c; }
// Exact enumeration of the payline over the reel strips (a PAR sheet in miniature).
function lineStats(strips, fixed) {
  const dists = strips.map((s, i) => fixed && fixed[i] ? [[fixed[i], 1]] : Object.entries(counts(s)).map(([t, n]) => [t, n / s.length]));
  let ev = 0, hit = 0, sq = 0;
  const types = new Array(dists.length);
  (function rec(i, p) {
    if (i === dists.length) {
      const r = evalLine(types);
      if (r) { ev += p * r.base; hit += p; sq += p * r.base * r.base; }
      return;
    }
    for (const [t, q] of dists[i]) { types[i] = t; rec(i + 1, p * q); }
  })(0, 1);
  return { ev, hit, sq };
}
const has = (run, id) => run.relics.includes(id);
const rtpFor = (run, bet) => RTP_BY_BET[bet] + (has(run, 'screws') ? 0.015 : 0);
// The casino re-calibrates every pay so the machine always returns exactly its RTP.
const MEMO = new Map();
function machine(run, strips, bet) {
  const key = strips.map(s => JSON.stringify(counts(s))).join('|') + bet + run.relics.join();
  if (MEMO.has(key)) return MEMO.get(key);
  if (MEMO.size > 300) MEMO.clear();
  const st = lineStats(strips);
  const rtp = rtpFor(run, bet);
  const scale = rtp / st.ev;
  const out = { rtp, scale, hit: st.hit, sd: Math.sqrt(Math.max(0, st.sq * scale * scale - rtp * rtp)) };
  MEMO.set(key, out);
  return out;
}

// ---------- map ----------
const ROOM = {

  forge: { name: 'Forge', icon: 'anvil' }, shop: { name: 'Merchant', icon: 'bag' }, altar: { name: 'Altar', icon: 'altar' },
  event: { name: 'Mystery', icon: 'mystery' }, boss: { name: 'Dragon', icon: 'dragon' },

function renderMap() {

  const lines = m.edges.map(([a, b]) => {
    const A = pos(m.nodes[a]), B = pos(m.nodes[b]);

  }).join('');
  const nodes = Object.values(m.nodes).map(n => {

    return `<button class="node ${st} ${n.k === 'boss' ? 'boss' : ''}" data-k="${n.k}" style="left:${p.x}%;top:${p.y}px" aria-label="${ROOM[n.type].name}">${px(ROOM[n.type].icon)}</button>`;
  }).join('');
  screen.innerHTML = `
    <div class="scr map">
      <div class="map-scroll" id="mapScroll"><div class="map-inner" style="height:${H}px">

    </div>`;
  screen.querySelectorAll('.node.reach').forEach(b => b.onclick = () => { sfx.click(); enterRoom(b.dataset.k); });
  const sc = $('#mapScroll');

}
function enterRoom(k) {
  const n = run.map.nodes[k];
  run.pos = k; run.visited.push(k);
  switch (n.type) {
    case 'fight': return startFight(pick(n.f <= 2 ? TIER1 : TIER2), 'fight');
    case 'elite': return startFight('orc', 'elite');
    case 'boss':  return startFight('dragon', 'boss');
    case 'chest': {
      const relic = randomRelic(run);
      run.room = { picked: null, chests: shuffle([
        relic ? { kind: 'relic', id: relic } : { kind: 'gold', v: 35 },
        { kind: 'gold', v: ri(20, 30) },
        { kind: 'syms', items: [{ t: 'gem', lvl: 0 }, { t: pick(WEAPONS), lvl: 1 }] },
      ]) };

    }
    case 'forge': {
      const all = [];
      run.strips.forEach((s, c) => s.forEach((x, i) => { if (WEAPONS.includes(x.t) && x.lvl < 2) all.push([c, i]); }));
      const seen = new Set(), opts = [];
      for (const [c, i] of shuffle(all)) { const x = run.strips[c][i], key = c + x.t + x.lvl; if (seen.has(key)) continue; seen.add(key); opts.push([c, i]); if (opts.length === 3) break; }
      run.room = { opts, done: null };

    }
    case 'altar': run.room = { sel: null, done: null }; return go('altar');
    case 'shop': {
      const PRICE = { sword: 10, fire: 10, shield: 8, cherry: 6, bar: 8, seven: 14, gem: 18 };
      const syms = rewardSymbols(run).map(s => ({ ...s, price: PRICE[s.t] + s.lvl * 8, sold: false }));
      const relic = randomRelic(run);

                   nudge: { price: 10, sold: false }, msg: null };
      return go('shop');
    }
    case 'event': run.room = { id: pick(Object.keys(EVENTS)), result: null }; return go('event');
  }

function drawReel(c) {

  const m = machine(run, f.strips, run.bet);

  $('#betN').textContent = run.bet;

function changeBet(d) {

async function animateReels(f, oldPos, held) {
  const reels = [...document.querySelectorAll('.reel')];
  await Promise.all(reels.map((reel, c) => new Promise(resolve => {
    if (held[c]) { drawReel(c); return resolve(); }
    const s = f.strips[c], n = s.length;
    const k = mod(oldPos[c] - f.pos[c], n) + n * (1 + Math.floor(c / 2));
    const seq = [];
    for (let j = 0; j < k + 3; j++) seq.push(s[mod(f.pos[c] - 1 + j, n)]);
    const len = seq.length;
    const strip = reel.querySelector('.strip');
    strip.style.transition = 'none';
    strip.style.height = (len / 3 * 100) + '%';
    strip.innerHTML = seq.map(x => cellHTML(x).replace('class="cell"', `class="cell" style="height:${100 / len}%"`)).join('');
    strip.style.transform = `translateY(-${(k / len) * 100}%)`;
    void strip.offsetHeight;
    const dur = (reduced ? 150 : 600) + c * (reduced ? 50 : 200);
    strip.style.transition = `transform ${dur}ms cubic-bezier(.2,.75,.3,1.05)`;
    strip.style.transform = 'translateY(0)';
    let ticks = 0;
    const tk = setInterval(() => { sfx.tick(); if (++ticks > dur / 80) clearInterval(tk); }, 80);
    setTimeout(() => { clearInterval(tk); sfx.stop(); drawReel(c); resolve(); }, dur + 30);
  })));
}
const midCell = c => document.querySelectorAll('.reel')[c].querySelectorAll('.cell')[1];
function showBanner(title, sub = '') {

}
async function countUp(el, to, hudFrom) {
  const steps = Math.min(16, to);
  for (let i = 1; i <= steps; i++) {
    const v = Math.round(to * i / steps);
    el.textContent = v; updateHud(hudFrom + v);
    if (i % 2) sfx.coin();
    await sleep(40);
  }
}

async function doSpin() {
  const f = run.fight;
  if (busy || !f || f.pending) return;
  const pr = spinPrice(run, f, run.bet);
  if (pr.total > run.gold) return;
  busy = true; pocketSel = null;
  f.strips.forEach((_, c) => { $('#tag' + c).textContent = ''; $('#tag' + c).className = 'tag'; });
  $('#ledWin').textContent = '0'; $('#ledWin').classList.remove('hot');
  $('#log').innerHTML = 'The reels are spinning…';
  refreshFight();
  const oldPos = [...f.pos];
  const p = startSpin(run, f);
  updateHud();
  floatAt($('#gold'), `−${p.price}`, 'loss');
  await animateReels(f, oldPos, p.held);
  // Nudge phase only when a nudge could actually help.
  if (run.nudges > 0 && bestNudge(run, f).gain > 0) {
    busy = false; save();
    $('#log').innerHTML = nudgeHint();
    anim($('#nudges'), 'pop');
    refreshFight();
    return;
  }
  busy = false;
  await collect();
}

async function collect() {
  const f = run.fight;
  if (busy || !f || !f.pending) return;
  busy = true;
  const shown = run.gold;
  const res = resolveSpin(run, f);
  refreshFight();
  // 1. the combination
  if (res.combo) {
    const n = res.combo.n;
    for (let c = 0; c < n; c++) midCell(c).classList.add('win');
    anim($('#payline'), 'flash');
    if (res.power) { sfx.big(); buzz(80); showBanner(comboName(res.power) + '!', res.pfx.dmg ? `${res.pfx.dmg} damage (${POWER_X[n]}${has(run, 'rage') ? '×2' : ''} × bet ${res.bet})` : `+${res.pfx.block} block`); await sleep(1000); }
    else if (['gem', 'seven'].includes(res.combo.t) && n >= 3 && !res.nudged) { sfx.jackpot(); buzz(200); showBanner('JACKPOT!', comboName(res.combo)); await sleep(1000); }
  }
  // 2. the payline acts: a weapon combo as one big blow, then every other symbol left to right
  if (res.power) {
    const n = res.power.n;
    for (let c = 0; c < n; c++) { anim(midCell(c), 'pop'); $('#tag' + c).textContent = 'POWER'; $('#tag' + c).className = 'tag ' + (res.pfx.dmg ? 'dmg' : 'block'); }
    if (res.pfx.dmg) {
      anim($('#hero'), 'lunge-r');
      await Promise.all(Array.from({ length: n }, (_, c) => fly(midCell(c), $('#enemy'), res.power.t)));
      sfx.big(); buzz(120); anim($('#enemy'), 'hit'); anim($('#stage'), 'shake');
      floatAt($('#enemy'), res.pfx.dmg, 'dmg');
    } else { sfx.block(); floatAt($('#hero'), `+${res.pfx.block}`, 'block'); await sleep(300); }
  }
  for (let c = res.power ? res.power.n : 0; c < res.cells.length; c++) {
    const fx = res.cells[c], cell = midCell(c), tag = $('#tag' + c);
    anim(cell, 'pop');
    if (fx.dmg) {
      tag.textContent = `${fx.dmg} DMG`; tag.className = 'tag dmg';
      anim($('#hero'), 'lunge-r');
      await fly(cell, $('#enemy'), fx.t);
      sfx.hit(); buzz(15);
      anim($('#enemy'), 'hit'); floatAt($('#enemy'), fx.dmg, 'dmg');
    } else if (fx.block) {
      tag.textContent = `+${fx.block} BLK`; tag.className = 'tag block';
      sfx.block(); floatAt($('#hero'), `+${fx.block}`, 'block');
      await sleep(160);
    } else if (fx.rush) {
      tag.textContent = 'RUSH'; tag.className = 'tag hex';
      sfx.hurt(); anim($('#intent'), 'hit');
      await sleep(220);
    } else { tag.textContent = '–'; tag.className = 'tag none'; await sleep(60); }
  }
  $('#hpFill').style.width = (f.enemy.hp / f.enemy.maxHp) * 100 + '%';
  $('#hpTxt').textContent = `${f.enemy.hp}/${f.enemy.maxHp}`;
  if (res.block) { $('#blockBadge').hidden = false; $('#blockN').textContent = `${res.blockTotal} BLOCK`; }
  // 3. the payout
  if (res.win) {

    await countUp($('#ledWin'), res.win, shown);
  }
  $('#log').innerHTML = spinLog(res);
  if (res.nudgeAward) { sfx.nudge(); showBanner('NUDGE AWARDED', '+1 nudge'); anim($('#nudges'), 'pop'); }
  await sleep(250);

  if (res.killed) {
    sfx.die(); anim($('#enemy'), 'dead');
    await sleep(800);
    busy = false;
    return winFight();
  }
  if (res.enraged) { sfx.big(); showBanner('THE DRAGON RAGES!', 'attack +' + f.enemy.enrage); await sleep(900); }
  if (res.enemy) {
    const a = res.enemy;
    anim($('#enemy'), 'lunge-l'); await sleep(140);
    if (a.absorbed) { sfx.block(); floatAt($('#hero'), `BLOCK ${a.absorbed}`, 'block'); }
    if (a.taken) { sfx.hurt(); buzz(90); anim($('#hero'), 'hit'); floatAt($('#gold'), `−${a.taken}`, 'loss'); }
    $('#log').innerHTML += `<br>${f.enemy.name} attacks: <b class="d">−${a.atk}</b>${a.absorbed ? `, block stops <b class="bl">${a.absorbed}</b>` : ''}.` +
      (a.curseReel !== null ? ` A <b>skull</b> lands on reel ${a.curseReel + 1}.` : '');
    await sleep(350);
  }
  updateHud();
  if (res.dead) { await sleep(500); busy = false; run.screen = 'over'; save(); return render(); }
  busy = false;
  save();
  f.strips.forEach((_, c) => drawReel(c));
  refreshFight();
}
function spinLog(res) {
  let out;
  if (!res.combo) out = `No win. Your bet of ${res.bet} is gone.`;
  else if (res.nudged) out = `<b>${comboName(res.combo)}</b>, but nudged spins pay no gold.`;
  else out = `<b>${comboName(res.combo)}</b> ${fmtMult(res.mult)} × bet ${res.bet} = <b class="g">+${res.win} gold</b>`;
  const bits = [];
  if (res.dmg) bits.push(`<b class="d">${res.dmg} damage</b>`);
  if (res.block) bits.push(`<b class="bl">+${res.block} block</b>`);
  if (res.rush) bits.push(`<b>enemy rushes</b>`);
  return out + (bits.length ? '<br>' + bits.join(' · ') : '');
}
function winFight() {
  const f = run.fight;
  run.stats.kills++;
  if (f.kind === 'boss') { run.fight = null; run.screen = 'win'; save(); return render(); }
  const gold = f.kind === 'elite' ? ri(20, 28) : ri(8, 13);
  run.gold += gold;
  let relic = null;
  if (f.kind === 'elite') { relic = randomRelic(run); if (relic) run.relics.push(relic); }
  run.room = { gold, relic, options: rewardSymbols(run), enemy: f.enemy.name };
  run.fight = null;
  go('reward');
}

function symDesc(t, lvl = 0) {
  const r = run && run.cls ? run : { cls: null, relics: [] };
  switch (t) {
    case 'sword':  return `${3 + lvl + (r.cls === 'warrior' ? 1 : 0) + (has(r, 'whetstone') ? 1 : 0)} damage` + (r.cls === 'warrior' ? '' : ', halved by armor');
    case 'fire':   return `${3 + lvl + (has(r, 'crystal') ? 1 : 0)} damage, ignores armor`;
    case 'shield': return `+${4 + lvl} block`;
    case 'cherry': return 'One on reel 1 returns your bet' + (r.cls === 'rogue' ? ', 2 damage' : '');
    case 'bar':    return 'Pays well in a row';
    case 'seven':  return 'The jackpot symbol';
    case 'gem':    return 'Wild: stands in for anything' + (has(r, 'magnet') ? ', 4 damage' : '');
    case 'skull':  return has(r, 'bonering') ? '5 damage' : 'The enemy attacks one spin sooner';

}
function symTile(s, extra = '', attrs = '') {

function toMap() { run.room = null; go('map'); }
function queuePlace(syms, back) { run.place = syms.map(s => ({ t: s.t, lvl: s.lvl || 0 })); run.placeBack = back; go('place'); }
function renderPlace() {

  screen.innerHTML = `
    <div class="scr room">
      <div class="head">${px(s.t)}<div><h2>${SYM[s.t].name}${s.lvl ? ' +' + s.lvl : ''}</h2><p>Which reel? It replaces a blank. With no blank left, the reel grows by one stop. Combos count from the left, so reels 1–3 matter most.</p></div></div>
      <div class="reelcards">${run.strips.map((strip, c) => {
        const blank = strip.some(x => x.t === 'blank');

      <div><b>${pct(m.rtp)}</b><span>RTP</span></div>
      <div><b>${pct(m.hit)}</b><span>hit rate</span></div>
      <div><b>${volLabel(m.sd)}</b><span>volatility</span></div>
    </div>
    <p class="txt">RTP means the machine pays back <b>${pct(m.rtp)}</b> of everything you bet, on average. The remaining ${pct(1 - m.rtp)} is the house edge. The numbers are calculated exactly from your reels.</p>
    <h3>Bet and RTP</h3>
    <div class="denoms">${BETS.map(b => `<div class="${b === bet ? 'on' : ''} ${betsFor(run).includes(b) ? '' : 'lockd'}"><b>${b}</b>${pct(rtpFor(run, b))}</div>`).join('')}</div>
    <p class="txt">As in real casinos, higher denominations pay back more. But a high bet drains your life faster when luck turns.</p>
    <h3>Paytable at bet ${bet} (gold)</h3>
    <p class="txt">In a row on the middle line, starting from reel 1.</p>
    ${head}${rows}
    <h3>Weapon combos (3 / 4 / 5 in a row)</h3>
    ${powerRows}
    <p class="txt">Combos replace the single effects of the symbols in them, and ignore armor. Nudged spins pay no gold. The casino re-calibrates the paytable whenever your reels change.</p>
    <h3>Your reels${run.fight ? ' (with curses)' : ''}</h3>
    ${strips.map((s, c) => `<div><div class="lbl">Reel ${c + 1} · ${s.length} stops</div><div class="chips">${reelChips(s)}</div></div>`).join('')}
    <h3>${C.name}</h3>
    <p class="txt">${C.passive}</p>
    <h3>Relics</h3>
    ${run.relics.length ? run.relics.map(r => `<div class="row">${px(RELICS[r].icon)}<p><b>${RELICS[r].name}</b><br>${RELICS[r].desc}</p><span></span></div>`).join('') : '<p class="txt">None yet. Find them in chests, at the merchant, and on elite enemies.</p>'}
    <button class="btn ghost" id="sound">${muted ? 'Sound on' : 'Sound off'}</button>
    <button class="btn ghost" id="quit">Give up this run</button>
  `);
  $('#sound').onclick = () => { muted = !muted; try { localStorage.setItem('oah-muted', muted ? '1' : '0'); } catch (e) {} openMachine(); };
  $('#quit').onclick = () => {
    const b = $('#quit');
    if (b.dataset.sure) { $('#modal').hidden = true; busy = false; run.screen = 'over'; save(); render(); }
    else { b.dataset.sure = '1'; b.textContent = 'Tap again to give up'; }
  };
}
function openHelp() {
  openModal(`
    <h3>How to play</h3>
    <p class="txt"><b>1. Gold is your life.</b> Every spin is paid with your life. At 0 the run is over.</p>
    <p class="txt"><b>2. Bet.</b> The bet multiplies payouts and weapon combos. It does not change single attacks. A low bet is safe and slow, a high bet is a gamble on huge blows.</p>
    <p class="txt"><b>3. Spin.</b> Five real reels with fixed strips. <b>Only the middle row</b> counts, read from the left.</p>
    <p class="txt"><b>4. Attack.</b> Every weapon on the line acts at once, even without a win: Sword and Fire deal 3 damage, Shield gives 4 block.</p>
    <p class="txt"><b>5. Power strike.</b> Three or more of the same weapon from the left (wilds count) make a combo: <b>10 / 25 / 60 × your bet</b> in damage for 3 / 4 / 5 in a row, plus a payout.</p>
    <p class="txt"><b>6. Win.</b> Runs in the paytable pay gold. The machine pays back 94–97% on average. The house wins in the long run.</p>
    <p class="txt"><b>7. Nudge.</b> After the reels stop, if a nudge could help, you can tap the symbol just above or below the line to pull it in. A nudged spin pays no gold, it only fights. You get a nudge every fight, and losing spins sometimes award one.</p>
    <p class="txt"><b>8. Hold.</b> Hold up to three reels so they stay for the next spin. A hold costs at least half the bet per reel, more if it sets up a big win. A reel cannot be held twice in a row.</p>
    <p class="txt"><b>9. Pocket.</b> Tap a symbol on the line to save it. Put it on any reel later, when it suits you. It counts as a hold.</p>
    <p class="txt"><b>10. The enemy</b> shows when it attacks and how much gold it takes. Block absorbs the hit and then resets. Skulls on the line make the enemy attack sooner.</p>
    <h3>Symbols</h3>
    ${['sword', 'fire', 'shield', 'cherry', 'bar', 'seven', 'gem', 'skull', 'blank'].map(t => `<div class="row">${t === 'blank' ? '<span style="width:32px"></span>' : px(t)}<p><b>${SYM[t].name}</b><br>${symDesc(t, 0)}</p><span></span></div>`).join('')}
    <h3>The map</h3>
    ${Object.entries(ROOM).map(([k, R]) => `<div class="row">${px(R.icon)}<p><b>${R.name}</b><br>${{
      fight: 'A regular enemy. Gives a bounty and a new symbol.', elite: 'A tough enemy that curses your reels. Bigger bounty and a relic.',
      chest: 'Pick one of three chests.', forge: 'Upgrade a weapon.', shop: 'Buy symbols, relics and nudges with your life.',
      altar: 'Remove a stop from a reel.', event: 'Something unexpected.', boss: 'The final boss.' }[k]}</p><span></span></div>`).join('')}
  `);
}
$('#machBtn').onclick = () => { sfx.click(); openMachine(); };
$('#helpBtn').onclick = () => { sfx.click(); openHelp(); };

// ---------- boot ----------
window.claude?.hot?.snapshot?.(() => ({ run }));
function start(data) {
  run = (data && data.run) || null;
  if (run && run.screen === 'fight' && !run.fight) run.screen = 'map';
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
