<title>One-Armed Hero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#120e1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one portrait cabinet column. HUD, battle stage with charms, LED strip, a 5×3 slot with 10 lines and a lit attack row, then bet / special / lever at thumb height. */
:root {
  --ink: #120e1c;
  --stone: #1e172e;
  --stone-2: #2b2242;
  --line: #43365f;
  --brass: #f0b648;
  --brass-dk: #9d6a1c;
  --parch: #f3e6c9;
  --muted: #a99cc6;
  --blood: #e8505f;
  --mana: #63b8ff;
  --leaf: #8adf6e;
  --hex: #c27ae0;
  --led: #ff5a3c;
  --display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --mono: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--parch);
  font-family: var(--display); font-size: 16px;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
[hidden] { display: none !important; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

#app {
  position: relative; height: 100%; max-width: 480px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px; box-sizing: border-box; overflow: hidden;
}

/* ---------- HUD ---------- */
.hud { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.gold { display: flex; align-items: center; gap: 6px; background: var(--stone-2); border: 2px solid var(--brass-dk);
  padding: 2px 10px 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 22px; color: var(--brass); font-variant-numeric: tabular-nums; }
.gold img { width: 28px; height: 28px; }
.gold small { font-size: 9px; color: var(--muted); letter-spacing: 0.08em; align-self: flex-end; margin-bottom: 4px; }
.gold.low { color: var(--blood); border-color: var(--blood); animation: throb 0.8s steps(2) infinite; }
.floor { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; flex: 1; text-align: center; line-height: 1.3; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; background: var(--stone-2); border: 2px solid var(--line);
  border-radius: 4px; padding: 0; font-family: var(--mono); font-size: 16px; }
.iconbtn img { width: 26px; height: 26px; }
.iconbtn:active { transform: translateY(2px); }
@keyframes throb { 50% { opacity: 0.55; } }

#screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scr { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
h2 { font-size: 24px; color: var(--brass); }
p { margin: 0; line-height: 1.4; }
.lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--brass); color: var(--ink);
  border: 0; border-radius: 4px; padding: 14px 18px; font-weight: 700; font-size: 18px;
  box-shadow: 0 5px 0 var(--brass-dk), inset 0 -3px 0 rgba(0,0,0,0.12); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--brass-dk); }
.btn.ghost { background: var(--stone-2); color: var(--parch); box-shadow: 0 5px 0 #0b0812; border: 2px solid var(--line); }
.btn:disabled { opacity: 0.45; transform: none; }
.btn img { width: 22px; height: 22px; }

/* ---------- Title ---------- */
.title { justify-content: center; text-align: center; gap: 20px; }
.logo { font-size: clamp(40px, 13vw, 58px); line-height: 0.92; color: var(--brass); text-shadow: 0 4px 0 var(--brass-dk), 0 8px 0 #000; }
.logo span { display: block; color: var(--parch); text-shadow: 0 4px 0 #6b5a3a, 0 8px 0 #000; }
.tagline { color: var(--muted); max-width: 32ch; margin: 0 auto; }
.trio { display: flex; justify-content: center; gap: 10px; }
.trio img { width: 72px; height: 72px; animation: bob 1.2s steps(2) infinite; }
.trio img:nth-child(2) { animation-delay: 0.4s; }
.trio img:nth-child(3) { animation-delay: 0.8s; }
.title .stack { display: grid; gap: 14px; }
@keyframes bob { 50% { transform: translateY(-4px); } }

/* ---------- Class select ---------- */
.cls-list { display: grid; gap: 10px; overflow-y: auto; min-height: 0; padding-bottom: 8px; }
.cls { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--stone); border: 2px solid var(--line); border-radius: 6px; padding: 10px; }
.cls:active, .cls:hover { border-color: var(--brass); }
.cls > img.px { width: 64px; height: 64px; }
.cls h3 { font-size: 20px; }
.cls p { font-size: 14px; color: var(--muted); margin-top: 2px; }
.cls .passive { color: var(--parch); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: var(--stone-2); border: 2px solid transparent; border-radius: 3px;
  padding: 1px 5px 1px 2px; font-family: var(--mono); font-size: 11px; color: var(--parch); }
.chip img { width: 18px; height: 18px; }
.chip.blank { color: var(--muted); padding-left: 6px; }
button.chip.sel { border-color: var(--brass); }

/* ---------- Map ---------- */
.map-scroll { flex: 1; min-height: 0; overflow-y: auto; border: 2px solid var(--line); border-radius: 6px;
  background: repeating-linear-gradient(0deg, transparent 0 22px, rgba(255,255,255,0.025) 22px 24px), var(--stone); }
.map-inner { position: relative; margin: 0 8px; }
.map-inner svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.node { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; padding: 0; display: grid; place-items: center;
  background: var(--stone-2); border: 2px solid var(--line); border-radius: 50%; }
.node img { width: 32px; height: 32px; }
.node.boss { width: 72px; height: 72px; margin: -36px 0 0 -36px; border-color: var(--blood); }
.node.boss img { width: 52px; height: 52px; }
.node.locked { opacity: 0.5; filter: grayscale(0.7); }
.node.done { opacity: 0.35; filter: grayscale(1); }
.node.here { border-color: var(--parch); opacity: 1; filter: none; }
.node.reach { border-color: var(--brass); box-shadow: 0 0 0 4px rgba(240,182,72,0.18); animation: pulse 0.9s steps(2) infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(240,182,72,0.32); } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.legend span { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); }
.legend img { width: 18px; height: 18px; }

/* ---------- Fight: stage ---------- */
.fight { gap: 6px; }
.stage { position: relative; height: clamp(124px, 21vh, 200px); flex: none; border: 2px solid var(--line); border-radius: 6px; overflow: hidden;
  background: linear-gradient(to bottom, transparent 72%, #17121f 72%, #17121f 74%, #251d35 74%),
    repeating-linear-gradient(90deg, #1b1529 0 30px, #1f182e 30px 32px), #1b1529; }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 10%, rgba(240,140,60,0.14), transparent 55%); }
.ehead { position: absolute; top: 6px; right: 8px; left: 56%; z-index: 2; display: grid; gap: 3px; }
.ename { font-size: 12px; text-align: right; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hpbar { position: relative; height: 15px; background: #0b0812; border: 2px solid #000; border-radius: 2px; }
.hpbar i { position: absolute; inset: 0 auto 0 0; background: var(--blood); transition: width 0.25s steps(5); }
.hpbar b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 9px; font-weight: 400; color: #fff; text-shadow: 1px 1px 0 #000; }
.intentwrap { position: absolute; left: 29%; right: 33%; bottom: 8px; z-index: 2; display: flex; justify-content: center; pointer-events: none; }
.intentwrap.ruled { bottom: 26px; }
.intent { display: flex; align-items: center; gap: 4px; max-width: 100%; font-size: 11px !important; background: rgba(10,8,18,0.85); border: 1px solid var(--line);
  border-radius: 3px; padding: 2px 6px; font-size: 12px; line-height: 1.15; }
.intent img { width: 18px; height: 18px; }
.intent b { color: var(--blood); font-family: var(--mono); font-weight: 400; font-size: 12px; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 6px; height: 6px; background: var(--blood); }
.pips i.off { background: var(--line); }
.intent.now { border-color: var(--blood); animation: throb 0.5s steps(2) infinite; }
.actor { position: absolute; bottom: 12%; z-index: 1; }
.actor img { width: clamp(52px, min(19vw, 11vh), 84px); height: auto; }
.hero { left: 7%; }
.enemy { right: 5%; }
.enemy.big img { width: clamp(60px, min(26vw, 12vh), 110px); }
.actor .sprite { animation: bob 1s steps(2) infinite; }
.enemy .sprite { animation-delay: 0.5s; }
.blockbadge { position: absolute; left: -4px; top: -16px; display: flex; align-items: center; gap: 2px; font-family: var(--mono); font-size: 12px;
  color: var(--mana); background: rgba(10,8,18,0.85); border: 1px solid var(--mana); padding: 0 4px 0 1px; border-radius: 3px; white-space: nowrap; }
.blockbadge img { width: 18px; height: 18px; }
.lunge-r { animation: lungeR 0.28s steps(3); }
.lunge-l { animation: lungeL 0.28s steps(3); }
.hit { animation: hit 0.32s steps(4); }
@keyframes lungeR { 50% { transform: translateX(30px); } }
@keyframes lungeL { 50% { transform: translateX(-30px); } }
@keyframes hit { 0%, 100% { transform: translateX(0); filter: none; } 25% { transform: translateX(6px); filter: brightness(4) saturate(0); } 50% { transform: translateX(-6px); } 75% { transform: translateX(4px); filter: brightness(4) saturate(0); } }
.dead { animation: die 0.7s steps(6) forwards; }
@keyframes die { to { transform: translateY(20px) scaleY(0.2); opacity: 0; filter: brightness(3); } }
.banner { position: absolute; left: 0; right: 0; top: 36%; z-index: 3; text-align: center; pointer-events: none; display: grid; gap: 2px; opacity: 0; }
.banner b { font-size: 28px; font-weight: 700; color: var(--brass); text-shadow: 0 3px 0 #000, 0 0 14px rgba(240,182,72,0.55); }
.banner span { font-family: var(--mono); font-size: 12px; color: var(--parch); text-shadow: 1px 1px 0 #000; }
.banner.show { animation: banner 1.1s steps(9) forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(0.6); } 18% { opacity: 1; transform: scale(1.12); } 28% { transform: scale(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

/* ---------- Fight: machine ---------- */
.machine { flex: none; display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(#3a2a12, #2a1e0c); border: 3px solid var(--brass); border-radius: 8px;
  box-shadow: inset 0 0 0 3px #000, 0 4px 0 var(--brass-dk); padding: 6px 8px 8px; }
.led { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; background: #0a0505; border: 2px solid #000; border-radius: 3px; padding: 3px 6px; }
.led span { display: flex; flex-direction: column; align-items: center; font-family: var(--mono); font-size: 8px; color: #8a5a4a; letter-spacing: 0.08em; line-height: 1.1; }
.led b { font-family: var(--mono); font-weight: 400; font-size: 15px; color: var(--led); text-shadow: 0 0 6px rgba(255,90,60,0.6); font-variant-numeric: tabular-nums; }
.led b.hot { color: #ffd23c; text-shadow: 0 0 8px rgba(255,210,60,0.8); }
.reels { position: relative; height: clamp(150px, 30vh, 300px); display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; }
.reel + .reel { margin-left: 3px; }
.reel { position: relative; overflow: hidden; background: #f3e6c9; border-radius: 3px; box-shadow: inset 0 0 0 2px #000; }
.reel::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: linear-gradient(to bottom, rgba(18,14,28,0.72), rgba(18,14,28,0.45) 33.3%, transparent 33.4%, transparent 66.6%, rgba(18,14,28,0.45) 66.7%, rgba(18,14,28,0.72)); }
.reel.locked { box-shadow: inset 0 0 0 3px var(--brass); }
.strip { position: absolute; left: 0; right: 0; top: 0; height: 100%; will-change: transform; }
.cell { position: relative; display: grid; place-items: center; height: 33.333%; }
.cell img { height: 66%; width: auto; max-width: 88%; aspect-ratio: 1; }
.cell .lvx { position: absolute; right: 2px; top: 2px; font-family: var(--mono); font-style: normal; font-size: 9px; color: #fff; background: var(--brass-dk); padding: 0 3px; border-radius: 2px; }
.cell .tmp { position: absolute; left: 3px; top: 3px; font-family: var(--mono); font-style: normal; font-size: 8px; color: #fff; background: var(--hex); padding: 0 3px; border-radius: 2px; }
.cell .pk { position: absolute; left: 3px; bottom: 3px; font-family: var(--mono); font-style: normal; font-size: 8px; color: var(--ink); background: var(--leaf); padding: 0 3px; border-radius: 2px; }
.cell.win { background: rgba(240,182,72,0.6); }
.cell.pop img { animation: pop 0.3s steps(3); }
@keyframes pop { 50% { transform: scale(1.25); } }
.payline { position: absolute; left: -8px; right: -8px; top: 33.333%; height: 33.333%; z-index: 3; pointer-events: none;
  border-top: 2px solid var(--brass); border-bottom: 2px solid var(--brass); box-sizing: border-box; }
.payline span { position: absolute; left: 50%; top: -9px; transform: translateX(-50%); font-family: var(--mono); font-size: 7px; letter-spacing: 0.1em; color: var(--ink); background: var(--brass); padding: 0 4px; border-radius: 2px; line-height: 12px; }
.lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
.reel.wild { box-shadow: inset 0 0 0 3px var(--mana), 0 0 12px rgba(115,239,247,0.6); }
.reel.wild .cell { background: rgba(115,239,247,0.25); }
.reel.tease { box-shadow: inset 0 0 0 3px #ffd23c, 0 0 16px rgba(255,210,60,0.8); animation: throb 0.3s steps(2) infinite; }
.reel.stuck { box-shadow: inset 0 0 0 3px var(--leaf); }
.reel.stuck::before { content: "STUCK"; position: absolute; left: 50%; top: 2px; transform: translateX(-50%); z-index: 4; font-family: var(--mono); font-size: 7px; color: var(--ink); background: var(--leaf); padding: 0 3px; }
.machine.freemode { border-color: var(--mana); background: linear-gradient(#123a4a, #0c2430); box-shadow: inset 0 0 0 3px #000, 0 4px 0 #1f6f86, 0 0 18px rgba(115,239,247,0.35); }
.hs { position: absolute; inset: 0; z-index: 6; background: rgba(10,6,4,0.94); border-radius: 4px; display: flex; flex-direction: column; gap: 4px; padding: 4px; }
.hshead { text-align: center; font-family: var(--mono); font-size: 10px; color: var(--brass); }
.hshead b { font-weight: 400; color: #fff; font-size: 13px; }
.hsgrid { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr); gap: 3px; }
.hc { position: relative; background: #1d140a; border: 1px solid #3a2a12; border-radius: 3px; display: grid; place-items: center; }
.hc img { width: 60%; height: auto; }
.hc i { position: absolute; bottom: 1px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-style: normal; font-size: 9px; color: #fff; text-shadow: 1px 1px 0 #000; }
.hc.on { background: #4a3410; border-color: var(--brass); }
.hc.fresh { animation: pop 0.4s steps(3); box-shadow: 0 0 10px rgba(240,182,72,0.9); }
.hc.spinning { background: repeating-linear-gradient(0deg, #1d140a 0 6px, #2a1d0d 6px 12px); animation: throb 0.14s steps(2) infinite; }
.bigwin { position: absolute; inset: -4px; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(8,4,16,0.88); border-radius: 6px; }
.bigwin b { font-size: 34px; color: var(--brass); text-shadow: 0 4px 0 #000, 0 0 18px rgba(240,182,72,0.7); animation: pop 0.5s steps(3) infinite; }
.bigwin span { font-family: var(--mono); font-size: 30px; color: #fff; text-shadow: 0 3px 0 #000; font-variant-numeric: tabular-nums; }
.bigwin.mega b { color: #ff7ad9; } .bigwin.epic b { color: var(--mana); }
.payline::before, .payline::after { content: ""; position: absolute; top: 50%; margin-top: -7px; border: 7px solid transparent; }
.payline::before { left: -3px; border-left-color: var(--brass); }
.payline::after { right: -3px; border-right-color: var(--brass); }
.payline.flash { animation: flash 0.25s steps(2) 4; }
@keyframes flash { 50% { border-color: #fff; } }
.tag { position: absolute; left: 50%; top: calc(66.666% - 8px); transform: translateX(-50%); z-index: 4; white-space: nowrap;
  font-family: var(--mono); font-size: 8px; line-height: 14px; padding: 0 3px; border-radius: 2px; color: #fff; background: #000; }
.tag:empty { display: none; }
.tag.dmg { background: var(--blood); }
.tag.block { background: #2a6fc0; }
.tag.hex { background: var(--hex); }
.tag.none { background: rgba(0,0,0,0.6); color: #bbb; }
.reel .tap { position: absolute; left: 0; right: 0; height: 33.333%; z-index: 5; background: none; border: 0; padding: 0; }
.reel .tap.top { top: 0; } .reel .tap.mid { top: 33.333%; } .reel .tap.bot { top: 66.666%; }
.reel.nudgeable .cell:nth-child(1), .reel.nudgeable .cell:nth-child(3) { outline: 2px dashed var(--leaf); outline-offset: -4px; animation: throb 0.7s steps(2) infinite; }
.reel.nudgeable .cell:nth-child(1)::after { content: "▼"; position: absolute; bottom: 1px; font-size: 10px; color: var(--leaf); z-index: 3; }
.reel.nudgeable .cell:nth-child(3)::after { content: "▲"; position: absolute; top: 1px; font-size: 10px; color: var(--leaf); z-index: 3; }
.locks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.lockbtn { font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; padding: 6px 0; background: #1a120a; color: var(--brass);
  border: 2px solid var(--brass-dk); border-radius: 3px; }
.lockbtn.on { background: var(--brass); color: var(--ink); border-color: var(--brass); }
.lockbtn.put { background: var(--leaf); color: var(--ink); border-color: var(--leaf); animation: throb 0.6s steps(2) infinite; }
.lockbtn:disabled { opacity: 0.35; }
.log { flex: 1; font-size: 13px; color: var(--muted); min-height: 0; overflow-y: auto; line-height: 1.35; text-align: center; }
.log b { color: var(--parch); font-weight: 600; }
.log .d { color: var(--blood); } .log .g { color: var(--brass); } .log .bl { color: var(--mana); }
.controls { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 6px; align-items: stretch; }
.respins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; min-height: 22px; }
.respin { font-family: var(--mono); font-size: 10px; padding: 3px 0; background: #1a120a; color: var(--brass); border: 1px solid var(--brass-dk); border-radius: 3px; visibility: hidden; }
.respins.live .respin { visibility: visible; }
.respin:disabled { opacity: 0.35; }
.reel.kept { box-shadow: inset 0 0 0 3px var(--brass); }
.gamble { display: flex; align-items: center; gap: 6px; background: var(--stone-2); border: 2px solid var(--brass); border-radius: 4px; padding: 4px 6px; }
.gamble span { flex: 1; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.gamble span b { color: var(--brass); font-weight: 400; }
.gbtn { font-family: var(--mono); font-size: 11px; padding: 7px 10px; border: 0; border-radius: 3px; color: #fff; }
.gbtn.red { background: #b13e53; } .gbtn.black { background: #1a1c2c; border: 1px solid #555; }
.pocketbtn { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 3px 6px; text-align: left; background: var(--stone); border: 2px dashed var(--line); border-radius: 4px; font-size: 10px; line-height: 1.2; color: var(--muted); }
.pocketbtn .lbl { font-size: 8px; color: var(--leaf); }
.pocketbtn.full { border-style: solid; border-color: var(--leaf); color: var(--parch); }
.pocketbtn.armed { border-style: solid; border-color: var(--leaf); background: #1f3a1a; color: var(--parch); animation: throb 0.7s steps(2) infinite; }
.pocketbtn:disabled { opacity: 0.6; }
.tag.pk { background: var(--leaf); color: var(--ink); }
.float.heal { color: var(--leaf); }
.intent small { display: block; font-size: 9px; color: var(--muted); }
.intent b.heavy { color: #ff7a3c; } .intent b.guard, .intent b.hex, .intent b.sticky { color: var(--mana); } .intent b.heal { color: var(--leaf); } .intent b.rage { color: #ff7a3c; }
.intent.heavy { border-color: #ff7a3c; box-shadow: 0 0 8px rgba(255,122,60,0.5); }
.special { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 4px 8px; background: var(--stone); border: 2px solid var(--line); border-radius: 4px; text-align: left; }
.special .lbl { font-size: 9px; color: var(--parch); }

.iconbtn.on { background: var(--leaf); color: var(--ink); border-color: var(--leaf); }

.scr.map .charmbar { position: static; align-self: flex-start; }

.float { position: absolute; z-index: 20; pointer-events: none; font-family: var(--mono); font-size: 18px; text-shadow: 2px 2px 0 #000;
  transform: translate(-50%, -50%); animation: floatUp 1s steps(10) forwards; white-space: nowrap; }

const FLOORS = 8, COLS = 4;
function genMap() {
  const nodes = {}, edges = [];
  const key = (f, c) => f + '-' + c;
  const mk = (f, c) => ({ k: key(f, c), f, c, type: null, jx: (rng() - 0.5) * 0.35, jy: (rng() - 0.5) * 18 });
  const starts = shuffle([0, 1, 2, 3]).slice(0, 3);
  starts.push(pick(starts));
  for (let c of starts) {
    for (let f = 0; f < FLOORS; f++) {
      const k = key(f, c);
      if (!nodes[k]) nodes[k] = mk(f, c);
      if (f === FLOORS - 1) { if (!edges.some(e => e[0] === k && e[1] === 'boss')) edges.push([k, 'boss']); break; }
      let nc = Math.max(0, Math.min(COLS - 1, c + ri(-1, 1)));
      const crosses = edges.some(([a, b]) => { const A = nodes[a], B = nodes[b]; return A && B && A.f === f && ((c < A.c && nc > B.c) || (c > A.c && nc < B.c)); });
      if (crosses) nc = c;
      const nk = key(f + 1, nc);
      if (!nodes[nk]) nodes[nk] = mk(f + 1, nc);
      if (!edges.some(e => e[0] === k && e[1] === nk)) edges.push([k, nk]);
      c = nc;
    }
  }
  nodes.boss = { k: 'boss', f: FLOORS, c: 1.5, type: 'boss', jx: 0, jy: 0 };
  const weights = [['fight', 46], ['event', 22], ['elite', 12], ['shop', 11], ['forge', 9]];
  for (const n of Object.values(nodes)) {
    if (n.type) continue;
    if (n.f === 0) n.type = 'fight';
    else if (n.f === 4) n.type = 'chest';
    else if (n.f === FLOORS - 1) n.type = rng() < 0.5 ? 'forge' : 'shop';
    else {
      const pool = weights.filter(([t]) => !(t === 'elite' && n.f < 3) && !(t === 'shop' && n.f < 2));
      let x = rng() * pool.reduce((a, [, w]) => a + w, 0);
      for (const [t, w] of pool) { if ((x -= w) < 0) { n.type = t; break; } }
    }

}

async function animateReels(spin, oldStops) {
  const reels = [...document.querySelectorAll('.reel')];
  const delays = [];
  let stars = 0, tease = false, t = 0;
  for (let c = 0; c < REELS; c++) {
    t += c === 0 ? 520 : 170;
    if (tease) t += 650;
    delays.push(t);
    stars += [0, 1, 2].filter(r => spin.raw[r][c] === 'star').length;
    if (stars >= 2 && c < REELS - 1) tease = true;
  }
  await Promise.all(reels.map((reel, c) => new Promise(resolve => {
    if (spin.stuck === c) { reel.classList.add('stuck'); setTimeout(resolve, 50); return; }
    if (spin.respin !== null && spin.respin !== undefined && spin.respin !== c) { setTimeout(resolve, 50); return; }
    reel.classList.remove('stuck', 'wild');
    const s = STRIPS[c], n = s.length;
    const dur = (spin.respin != null ? 700 : delays[c]) * speed();
    const k = mod(oldStops[c] - spin.stops[c], n) + n * (1 + Math.floor(dur / 900));
    const seq = [];
    for (let j = 0; j < k + 3; j++) seq.push(s[mod(spin.stops[c] - 1 + j, n)]);
    const len = seq.length, strip = reel.querySelector('.strip');
    strip.style.transition = 'none';
    strip.style.height = (len / 3 * 100) + '%';
    strip.innerHTML = seq.map(x => cellHTML(x).replace('class="cell"', `class="cell" style="height:${100 / len}%"`)).join('');
    strip.style.transform = `translateY(-${(k / len) * 100}%)`;
    void strip.offsetHeight;
    strip.style.transition = `transform ${dur}ms cubic-bezier(.2,.75,.3,1.04)`;
    strip.style.transform = 'translateY(0)';
    const tk = setInterval(sfx.tick, 90);
    const teaseAt = c > 0 && delays[c] - delays[c - 1] > 600;
    if (teaseAt) setTimeout(() => { reel.classList.add('tease'); sfx.tease(); }, (delays[c - 1]) * speed());
    setTimeout(() => {
      clearInterval(tk); sfx.stop(); reel.classList.remove('tease');
      strip.style.transition = 'none'; strip.style.transform = 'none'; strip.style.height = '100%';
      strip.innerHTML = [0, 1, 2].map(r => cellHTML(spin.raw[r][c])).join('');
      resolve();
    }, dur + 20);
  })));
}

    else await countUp($('#ledWin'), res.hold.gold, shown);
    shown += res.hold.gold;
    $('#hs').hidden = true;
    $('#hpFill').style.width = (f.enemy.hp / f.enemy.maxHp) * 100 + '%';
    $('#hpTxt').textContent = `${f.enemy.hp}/${f.enemy.maxHp}`;
  }
  if (res.freeAward) {
    res.spin.grid.forEach((row, r) => row.forEach((t, c) => { if (t === 'star') anim(cellAt(r, c), 'pop'); }));
    sfx.jackpot(); buzz(200);
    showBanner(res.free ? 'RETRIGGER!' : 'FREE SPINS!', `+${res.freeAward} spins · wins ×${FREE_MULT} · enemy frozen`);
    await sleep(1300);
  }
  $('#log').innerHTML = spinLog(res);
  updateHud();
  await sleep(200);

  if (res.killed) {
    sfx.die(); anim($('#enemy'), 'dead');
    await sleep(800);
    busy = false; auto = false;
    return winFight();
  }
  if (res.enraged) { sfx.big(); showBanner('THE DRAGON RAGES!', 'attack +' + f.enemy.enrage); await sleep(900); }
  if (res.enemy) {
    const a = res.enemy;
    if (a.type === 'attack' || a.type === 'heavy') {
      if (a.type === 'heavy') { showBanner('HEAVY BLOW!', `−${a.v} gold`); await sleep(500); }
      anim($('#enemy'), 'lunge-l'); await sleep(140);
      if (a.absorbed) { sfx.block(); floatAt($('#hero'), `BLOCK ${a.absorbed}`, 'block'); }
      if (a.taken) { sfx.hurt(); buzz(a.type === 'heavy' ? 200 : 90); anim($('#hero'), 'hit'); floatAt($('#gold'), `−${a.taken}`, 'loss'); }
      if (a.mirror) floatAt($('#enemy'), a.mirror, 'dmg');
      $('#log').innerHTML += `<br>${f.enemy.name} ${a.type === 'heavy' ? 'lands a heavy blow' : 'attacks'}: <b class="d">−${a.v}</b>${a.absorbed ? `, block stops <b class="bl">${a.absorbed}</b>` : ''}.`;
    } else if (a.type === 'heal') {
      sfx.charge(); floatAt($('#enemy'), `+${a.v}`, 'heal');
      $('#log').innerHTML += `<br>${f.enemy.name} heals <b>${a.v}</b>.`;
      $('#hpFill').style.width = (f.enemy.hp / f.enemy.maxHp) * 100 + '%';
      $('#hpTxt').textContent = `${f.enemy.hp}/${f.enemy.maxHp}`;
    } else if (a.type === 'rage') {
      sfx.big(); showBanner('ENRAGED!', `attacks +${a.v}`);
      $('#log').innerHTML += `<br>${f.enemy.name} is enraged: attacks <b class="d">+${a.v}</b>.`;
    }
    await sleep(350);
  }
  updateHud();
  if (res.dead) { await sleep(500); busy = false; auto = false; run.screen = 'over'; save(); return render(); }
  busy = false;
  save();
  refreshFight();
  // free spins play themselves; autoplay stops on features and when gold runs low
  const stopAuto = res.freeAward || res.hold || res.win >= res.bet * 10 || run.gold < run.bet * 4;
  if (stopAuto && auto) { auto = false; refreshFight(); }
  if (f.free > 0 || auto) setTimeout(() => { if (run.fight === f && !busy && run.screen === 'fight') doSpin(); }, (auto && f.gamble ? 900 : 450) * speed());
}
function busyLock() { ['#betDn', '#betUp', '#special', '#spinBtn', '#buyBtn', '#pocketBtn'].forEach(s => { const el = $(s); if (el) el.disabled = true; }); document.querySelectorAll('.respin').forEach(b => { b.disabled = true; b.innerHTML = ''; }); const gm = $('#gamble'); if (gm) gm.hidden = true; }
function spinLog(res) {
  const parts = [];
  if (res.spin.wins.length) {
    const w = res.spin.wins;
    parts.push(`${w.length} line${w.length > 1 ? 's' : ''}: ` + w.slice(0, 3).map(x => `${x.n}× ${SYM[x.t].name}`).join(', ') + (w.length > 3 ? '…' : '') + ` = <b class="g">+${res.win}</b>${res.freeMult > 1 ? ` (×${res.freeMult})` : ''}`);
  } else parts.push(res.cost ? `No win. ${res.cost} gold gone.` : 'No win.');
  if (res.respin !== null) parts.unshift(`Respin reel ${res.respin + 1} (−${res.cost})`);
  if (res.hold) parts.push(`Hold &amp; Spin: <b class="g">+${res.hold.gold}</b>`);
  const bits = [];
  if (res.totalDmg) bits.push(`<b class="d">${res.totalDmg} damage</b>${res.fx.crit > 1 ? ` (crit ×${res.fx.crit})` : ''}`);
  if (res.blockGain) bits.push(`<b class="bl">+${res.blockGain} block</b>`);
  if (res.fx.stun) bits.push('<b>stun</b>');
  if (res.fx.rush) bits.push('<b>enemy rushes</b>');
  if (res.fx.charge) bits.push(`<b>+${res.fx.charge} charge</b>`);
  if (res.fx.stashed) bits.push(`<b>${res.fx.stashed.dmg} dmg held in pocket</b>`);
  if (res.guarded && res.totalDmg) bits.push('<b>guarded: half damage</b>');
  return parts.join(' · ') + (bits.length ? '<br>' + bits.join(' · ') : '');
}
function winFight() {
  const f = run.fight;
  run.stats.kills++;
  if (f.kind === 'boss') { run.fight = null; run.screen = 'win'; save(); return render(); }
  const gold = f.kind === 'elite' ? ri(20, 28) * 10 : ri(8, 13) * 10;
  run.gold += gold;
  run.room = { gold, enemy: f.enemy.name, picks: f.kind === 'elite' ? 2 : 1, offer: charmOffer(run, 3), replace: null };
  run.fight = null;
  go('reward');
}

function takeCharm(id, back) {
  if (run.charms.length < CHARM_SLOTS) { run.charms.push(id); return true; }
  run.room.replace = { id, back };
  return false;
}
function replaceHTML() {
  const R = run.room.replace;

    <button class="btn ghost" id="repCancel">Keep my charms</button>`;
}
function bindReplace(done) {

function renderReward() {

    <div class="row">${px('star')}<p><b>Scatter</b><br>3 / 4 / 5 anywhere: ${FREE_SPINS[3]} / ${FREE_SPINS[4]} / ${FREE_SPINS[5]} free spins, wins ×${FREE_MULT}, enemy frozen</p><span></span></div>
    <div class="row">${px('coin')}<p><b>Coin</b><br>${HS_TRIGGER}+ anywhere: Hold &amp; Spin. Coins pay their value and hit the enemy. Fill all 15: GRAND ${HS_GRAND}× bet</p><span></span></div>
    <div class="row">${px('chestOpen')}<p><b>Bonus buy</b><br>${FREE_SPINS[3]} free spins for ${BONUS_BUY_X}× bet (${bonusBuyPrice(run)} gold), average return 22.6×</p><span></span></div>
    <button class="btn ghost" id="sound">${muted ? 'Sound on' : 'Sound off'}</button>
    <button class="btn ghost" id="quit">Give up this run</button>
  `);
  $('#sound').onclick = () => { muted = !muted; try { localStorage.setItem('oah-muted', muted ? '1' : '0'); } catch (e) {} openMachine(); };
  $('#quit').onclick = () => {
    const b = $('#quit');
    if (b.dataset.sure) { $('#modal').hidden = true; busy = false; auto = false; run.screen = 'over'; save(); render(); }
    else { b.dataset.sure = '1'; b.textContent = 'Tap again to give up'; }
  };
}
function openHelp() {
  openModal(`
    <h3>How to play</h3>
    <p class="txt"><b>Gold is your life.</b> Every spin is paid with it. At 0 the run is over.</p>
    <p class="txt"><b>The machine is real.</b> Five reels, 10 lines, wilds, scatters and Hold &amp; Spin, certified at ${pct(PAR.rtp)} RTP. You will lose money in the long run, like at any casino. Nothing in your run changes the payouts.</p>
    <p class="txt"><b>The attack row.</b> Weapons on the middle row always strike, win or not: Sword and Fire 3 damage, Shield 4 block. The bet does not change this.</p>
    <p class="txt"><b>Every win fights.</b> Each winning line fires its symbol's power. Sword and Fire lines hit, Shield lines block, BAR stuns, Seven crits, Cherry charges your special. Line hits grow with your bet: a high bet is a gamble on huge blows.</p>
    <p class="txt"><b>Features.</b> Scatters give free spins: wins ×${FREE_MULT} and the enemy is frozen. Coins trigger Hold &amp; Spin: the coins pay out and pelt the enemy. You can also buy free spins.</p>
    <p class="txt"><b>Your special</b> charges with every win. Use it when it is full.</p>
    <p class="txt"><b>Respin.</b> After a paid spin you may respin one reel; the other four stay, and their attack row strikes again. The price above each reel is the expected win ÷ ${pct(PAR.rtp)}, at least half a bet, so it never beats the house. One respin per spin.</p>
    <p class="txt"><b>Gamble.</b> After a win, guess red or black. Right doubles the gold and its line hits strike again. Wrong loses the gold and the enemy shrugs the hits off. Exactly 50/50, up to ${GAMBLE_MAX} times.</p>
    <p class="txt"><b>Pocket.</b> Hold back the next attack row's strikes instead of using them, then release them later at double strength. Perfect for a guarding enemy, a heavy blow or a Berserk spin. It keeps between fights.</p>
    <p class="txt"><b>Charms</b> (${CHARM_SLOTS} slots) change what wins and symbols do in combat. That is where your run grows.</p>
    <p class="txt"><b>The enemy</b> shows its plan: attacks and heavy blows (with a countdown), guarding (half damage), healing, enraging, hexing your wilds or making a reel stick. You also see what comes next. Block absorbs a hit and then resets. BAR lines delay attacks, skulls on the attack row speed them up.</p>
    <h3>The map</h3>
    ${Object.entries(ROOM).map(([k, R]) => `<div class="row">${px(R.icon)}<p><b>${R.name}</b><br>${{
      fight: 'A regular enemy. Gives a bounty and a charm.', elite: 'A tough enemy with a special rule. Bigger bounty and two charms.',
      chest: 'Pick one of three chests.', forge: 'Improve your attack row.', shop: 'Buy charms and services with your life.',
      event: 'Something unexpected.', boss: 'The final boss.' }[k]}</p><span></span></div>`).join('')}
  `);
}
$('#machBtn').onclick = () => { sfx.click(); openMachine(); };
$('#helpBtn').onclick = () => { sfx.click(); openHelp(); };
$('#turboBtn').onclick = () => { turbo = !turbo; try { localStorage.setItem('oah-turbo', turbo ? '1' : '0'); } catch (e) {} sfx.click(); updateHud(); };

// ---------- boot ----------
window.claude?.hot?.snapshot?.(() => ({ run }));
function start(data) {
  run = (data && data.run) || null;
  if (run && run.screen === 'fight' && !run.fight) run.screen = 'map';
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
